    // ─── 업무 수정 팝업 ───────────────────────────────────────────────────────
    let taskEditMode = '거래처';
    let taskEditTargetId = null;
    const taskEditModalOverlay = document.getElementById('taskEditModalOverlay');
    const taskEditTargetBizBtn = document.getElementById('taskEditTargetBizBtn');
    const taskEditTargetTextBtn = document.getElementById('taskEditTargetTextBtn');
    const taskEditTargetBiz = document.getElementById('taskEditTargetBiz');
    const taskEditSellerSelect = document.getElementById('taskEditSellerSelect');
    const taskEditTargetTextInput = document.getElementById('taskEditTargetTextInput');
    const taskEditBankSelect = document.getElementById('taskEditBankSelect');
    const taskEditBranchSelect = document.getElementById('taskEditBranchSelect');
    const taskEditMemoInput = document.getElementById('taskEditMemoInput');

    function setTaskEditMode(mode) {
      taskEditMode = mode;
      const isBiz = mode === '거래처';
      taskEditTargetBizBtn.classList.toggle('active', isBiz);
      taskEditTargetTextBtn.classList.toggle('active', !isBiz);
      taskEditTargetBiz.style.display = isBiz ? 'flex' : 'none';
      taskEditSellerSelect.style.display = isBiz ? 'block' : 'none';
      taskEditTargetTextInput.style.display = isBiz ? 'none' : 'block';
    }
    taskEditTargetBizBtn.onclick = () => setTaskEditMode('거래처');
    taskEditTargetTextBtn.onclick = () => setTaskEditMode('직접입력');

    function openTaskEditModal(t) {
      taskEditTargetId = t.id;
      setTaskEditMode(t.대상유형 === '직접입력' ? '직접입력' : '거래처');
      taskEditMemoInput.value = t.메모 || '';
      if (t.대상유형 === '직접입력') {
        taskEditTargetTextInput.value = t.대상텍스트 || '';
        taskEditBankSelect.value = '';
        taskEditBranchSelect.innerHTML = '<option value="">지점 선택</option>';
      } else {
        taskEditTargetTextInput.value = '';
        taskEditBankSelect.value = t.은행 || '';
        taskEditBankSelect.dispatchEvent(new Event('change'));
        setTimeout(() => {
          taskEditBranchSelect.value = t.지점 || '';
          taskEditBranchSelect.dispatchEvent(new Event('change'));
          setTimeout(() => { taskEditSellerSelect.value = t.판매자명 || ''; }, 400);
        }, 300);
      }
      taskEditModalOverlay.style.display = 'flex';
    }
    function closeTaskEditModal() { taskEditModalOverlay.style.display = 'none'; taskEditTargetId = null; }
    document.getElementById('taskEditCancelBtn').onclick = closeTaskEditModal;

    document.getElementById('taskEditSaveBtn').onclick = () => {
      if (!taskEditTargetId) return;
      const url = getUrl();
      const memo = taskEditMemoInput.value.trim();
      if (!memo) { alert('메모를 입력해주세요.'); return; }
      const payload = { targetType: taskEditMode, memo };
      if (taskEditMode === '거래처') {
        const bank = taskEditBankSelect.value, branch = taskEditBranchSelect.value;
        if (!bank || !branch) { alert('은행과 지점을 선택해주세요.'); return; }
        payload.bank = bank;
        payload.branch = branch;
        const sellerOpt = taskEditSellerSelect.selectedOptions[0];
        payload.seller = taskEditSellerSelect.value;
        payload.title = sellerOpt ? sellerOpt.textContent.replace(taskEditSellerSelect.value, '').trim() : '';
      } else {
        const targetText = taskEditTargetTextInput.value.trim();
        if (!targetText) { alert('대상을 입력해주세요.'); return; }
        payload.targetText = targetText;
      }
      jsonpRequest(url, { action: 'editTask', id: taskEditTargetId, data: JSON.stringify(payload) }, data => {
        if (data.error || data.ok === false) { alert('오류: ' + (data.error || data.message)); return; }
        closeTaskEditModal();
        loadTasks();
      });
    };

    // ─── 완료된 업무 목록 (펼칠 때 1회 로드, 페이지네이션) ─────────────────────
    const TASK_DONE_PAGE_SIZE = 8;
    let completedTasksLoaded = false;
    let completedTasksAll = [];
    let completedTasksPage = 1;

    function renderCompletedTasksPage() {
      const container = document.getElementById('completedTaskList');
      const totalPages = Math.max(1, Math.ceil(completedTasksAll.length / TASK_DONE_PAGE_SIZE));
      if (completedTasksPage > totalPages) completedTasksPage = totalPages;
      const start = (completedTasksPage - 1) * TASK_DONE_PAGE_SIZE;
      const pageItems = completedTasksAll.slice(start, start + TASK_DONE_PAGE_SIZE);

      container.innerHTML = '';
      pageItems.forEach(t => {
        const div = document.createElement('div');
        div.className = 'task-done-item';
        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div style="flex:1;">
              <div class="task-item-date">${escapeHtml(t.입력일)} → 완료 ${escapeHtml(t.처리일시)}</div>
              <div>${taskTargetLine(t)}</div>
              <div class="task-item-memo">"${escapeHtml(t.메모)}"</div>
            </div>
            <button class="task-done-delete-btn task-icon-btn" title="삭제" style="color:var(--danger);flex-shrink:0;">✕</button>
          </div>
        `;
        div.querySelector('.task-done-delete-btn').onclick = () => deleteCompletedTask(t.id);
        container.appendChild(div);
      });

      if (totalPages > 1) {
        const pager = document.createElement('div');
        pager.style.cssText = 'display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap;';
        for (let p = 1; p <= totalPages; p++) {
          const btn = document.createElement('button');
          btn.textContent = String(p);
          btn.style.cssText = 'width:auto;padding:6px 11px;font-size:12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;' +
            (p === completedTasksPage ? 'background:var(--primary);color:#fff;border-color:var(--primary);' : 'background:#fff;color:var(--text);');
          btn.onclick = () => { completedTasksPage = p; renderCompletedTasksPage(); };
          pager.appendChild(btn);
        }
        container.appendChild(pager);
      }
    }

    function deleteCompletedTask(id) {
      if (!confirm('이 완료 기록을 삭제하시겠습니까?')) return;
      const url = getUrl();
      jsonpRequest(url, { action: 'deleteCompletedTask', id }, data => {
        if (data.error || data.ok === false) { alert('오류: ' + (data.error || data.message)); return; }
        completedTasksAll = completedTasksAll.filter(t => t.id !== id);
        renderCompletedTasksPage();
      });
    }

    document.querySelector('.task-done-details').addEventListener('toggle', function () {
      if (!this.open || completedTasksLoaded) return;
      completedTasksLoaded = true;
      const url = getUrl();
      const container = document.getElementById('completedTaskList');
      container.textContent = '불러오는 중...';
      jsonpRequest(url, { action: 'listCompletedTasks' }, data => {
        if (data.error || !data.tasks) { container.textContent = '오류: ' + (data.error || ''); return; }
        if (!data.tasks.length) { container.textContent = '완료된 업무가 없습니다.'; return; }
        completedTasksAll = data.tasks;
        completedTasksPage = 1;
        renderCompletedTasksPage();
      });
    });

    function applyDashboard(data) {
      if (!data) return;
      if (data.error) { dashboardList.textContent = '오류: ' + data.error; return; }
      dashboardList.innerHTML = '';
      if (!data.banks || data.banks.length === 0) { dashboardList.textContent = '영업대상으로 체크된 지점이 없습니다.'; return; }
      renderDashboardSummary(data.banks);
      data.banks.forEach(b => dashboardList.appendChild(buildDashboardBank(b)));
    }

    function loadDashboard() {
      const url = getUrl();
      if (!url) { dashboardList.textContent = '연결 설정에서 URL을 먼저 입력하세요.'; return; }
      dashboardSummary.innerHTML = '';
      dashboardList.textContent = '불러오는 중...';
      jsonpRequest(url, { action: 'dashboard' }, applyDashboard);
    }

    const toggleDashboardListBtn = document.getElementById('toggleDashboardListBtn');
    toggleDashboardListBtn.onclick = () => {
      const hidden = dashboardList.style.display === 'none';
      dashboardList.style.display = hidden ? 'block' : 'none';
      toggleDashboardListBtn.textContent = hidden ? '은행별 방문 현황 숨기기' : '은행별 방문 현황 보기';
    };
    document.getElementById('refreshDashboardBtn').onclick = loadDashboard;

    // ─── ⑤ 방문 지도 ────────────────────────────────────────────────────────
    // 카카오 지도 SDK는 「지도 열기」를 누른 뒤에야 불러온다.
    // <head>에 넣으면 이 앱의 "외부 스크립트 0개 / 부팅 요청 1번" 성질이 깨지고,
    // 카카오 장애가 첫 화면을 막게 된다.
    const KAKAO_JS_KEY = '716f72f98726e9965086d554767e3b07'; // 카카오 JavaScript 키 (도메인 화이트리스트로 보호되므로 공개돼도 무방)

    const mapState = {
      sdkLoading: false, sdkReady: false, inited: false,
      data: null, map: null, clusterer: null,
      markers: [],            // { key, marker, v, bank }
      viewFilter: 'all', bank: '', fullscreen: false, // 'all' | 'unvisited' | 'visited'
      myMarker: null, myCircle: null, labels: []
    };

    // 이름표는 화면에 보이는 지점 전부에 붙인다. 지도 밖의 것까지 만들 이유는 없으므로
    // 보이는 영역으로만 제한한다. 아주 축소했을 땐(레벨 9+) 마커가 뭉쳐지므로 이름표도 뗀다.
    const MAP_LABEL_MAX_LEVEL = 8;
    const MAP_LABEL_MAX_COUNT = 600; // 실제 지점 수(453)보다 크게 잡아 잘리지 않게 한다
    const MAP_CLUSTER_MIN_LEVEL = 9; // 이 레벨부터 마커를 뭉친다(이름표가 붙는 레벨과 겹치지 않게)

    const mapStatusEl = () => document.getElementById('mapStatus');

    function mapFail(msg) {
      showStatus(mapStatusEl(), msg, true);
    }

    // 마커 이미지는 상태별로 3개만 만들어 수백 개 마커가 공유한다.
    // (CustomOverlay를 쓰면 DOM이 수백 개 생기고 클러스터링도 안 된다)
    const MAP_MARKER_IMAGES = {};
    function mapMarkerImage(v) {
      if (MAP_MARKER_IMAGES[v]) return MAP_MARKER_IMAGES[v];
      let svg, size;
      // 속은 전부 노란색으로 채워 지도 위에서 눈에 띄게 하고, 테두리 색으로 상태를 구분한다.
      size = 22;
      if (v === 0) {        // 미방문 = 빨간 테두리
        svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#fde047" stroke="#b91c1c" stroke-width="2.5"/></svg>';
      } else if (v === 1) { // 통화/제안서만 = 빨간 점선
        svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#fde047" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="3 2.5"/></svg>';
      } else {              // 방문완료 = 파란 테두리 (지우지 않고 색만 바뀐다)
        svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#fde047" stroke="#1d4ed8" stroke-width="2.5"/></svg>';
      }
      MAP_MARKER_IMAGES[v] = new kakao.maps.MarkerImage(
        'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
        new kakao.maps.Size(size, size),
        { offset: new kakao.maps.Point(size / 2, size / 2) }
      );
      return MAP_MARKER_IMAGES[v];
    }

    // 지점키 → { 은행명, 지점명, sellers }. 서버가 만든 키(k)로 조인한다.
    function mapBranchInfo(key) {
      return branchListData.find(b => b.k === key) || null;
    }

    function loadKakaoSdk(done) {
      if (mapState.sdkReady) { done(true); return; }
      if (mapState.sdkLoading) return;
      mapState.sdkLoading = true;

      const script = document.createElement('script');
      let settled = false;
      // 스크립트 요청 자체가 거절되면(401/403) 키·서비스 활성화·도메인 등록 문제이고,
      // 12초 무응답이면 네트워크 문제다. 원인이 다르니 안내도 달라야 한다.
      const finish = (ok, reason) => {
        if (settled) return;
        settled = true;
        clearTimeout(watchdog);
        mapState.sdkLoading = false;
        done(ok, reason);
      };
      const watchdog = setTimeout(() => finish(false, 'timeout'), 12000);

      script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY +
                   '&autoload=false&libraries=services,clusterer';
      script.onload = () => {
        if (!window.kakao || !kakao.maps) { finish(false, 'rejected'); return; }
        kakao.maps.load(() => { mapState.sdkReady = true; finish(true); });
      };
      script.onerror = () => finish(false, 'rejected');
      document.head.appendChild(script);
    }

    function openMap() {
      const wrap = document.getElementById('mapWrap');
      const btn = document.getElementById('mapOpenBtn');

      if (wrap.style.display !== 'none') {   // 이미 열려 있으면 접기
        wrap.style.display = 'none';
        btn.textContent = '지도 열기';
        return;
      }
      wrap.style.display = 'block';
      btn.textContent = '지도 접기';
      if (mapState.inited) { setTimeout(() => mapState.map && mapState.map.relayout(), 0); return; }

      hideStatus(mapStatusEl());
      showStatus(mapStatusEl(), '지도를 불러오는 중...');

      // 좌표는 거의 바뀌지 않으므로 저장해둔 것으로 먼저 그리고, 방문 상태만 뒤에서 갱신한다.
      const cachedMap = cacheLoad('mapData');
      let sdkOk = null, sdkReason = '', fresh = null, freshDone = false;

      const draw = () => {
        if (sdkOk === null) return;
        if (!sdkOk) {
          mapFail(sdkReason === 'rejected'
            ? '카카오 지도 설정을 확인해주세요. 카카오 개발자 사이트에서 ① 카카오맵 사용 설정 ON ② 웹 도메인 등록이 필요합니다.'
            : '지도를 불러오지 못했습니다. 통신 상태를 확인하고 다시 시도해주세요.');
          return;
        }
        // SDK가 준비되면 저장된 좌표로 즉시 표시 (네트워크를 기다리지 않는다)
        if (!mapState.inited && cachedMap && cachedMap.points) {
          initMap(cachedMap);
          showStatus(mapStatusEl(), '최신 방문 현황으로 갱신 중...');
        }
        if (!freshDone) return;

        if (fresh) {
          cacheSave('mapData', fresh);
          if (!mapState.inited) initMap(fresh);
          else setMapData(fresh);
          hideStatus(mapStatusEl());
        } else if (!mapState.inited) {
          mapFail('지도 데이터를 불러오지 못했습니다. 다시 시도해주세요.');
        } else {
          showStatus(mapStatusEl(), '갱신 실패 — 마지막으로 받은 정보를 표시하고 있습니다.', true);
        }
      };

      // SDK와 데이터를 동시에 부른다 (순차로 하면 두 배 느리다)
      loadKakaoSdk((ok, reason) => { sdkOk = ok; sdkReason = reason || ''; draw(); });
      jsonpRequest(getUrl(), { action: 'mapData' }, d => {
        freshDone = true;
        fresh = (d && !d.error && !d.__net && d.points) ? d : null;
        draw();
      });
    }

    function initMap(data) {
      if (!window.kakao || !kakao.maps) { mapFail('지도를 불러오지 못했습니다.'); return; }
      try {
        mapState.data = data;
        const canvas = document.getElementById('mapCanvas');
        // 첫 중심: 좌표가 있는 지점들의 평균 (없으면 서울시청)
        let cLat = 37.5665, cLng = 126.9780;
        if (data.points.length) {
          cLat = data.points.reduce((s, p) => s + p.lat, 0) / data.points.length;
          cLng = data.points.reduce((s, p) => s + p.lng, 0) / data.points.length;
        }
        const map = new kakao.maps.Map(canvas, {
          center: new kakao.maps.LatLng(cLat, cLng), level: 8
        });
        mapState.map = map;

        // 키가 틀리거나 도메인 미등록이면 예외 없이 흰 박스만 뜬다. 타일 로드로 감지한다.
        let tiles = false;
        kakao.maps.event.addListener(map, 'tilesloaded', () => {
          tiles = true;
          hideStatus(mapStatusEl());
        });
        setTimeout(() => {
          if (!tiles) mapFail('지도 키 설정을 확인해주세요 (카카오 개발자 사이트에 도메인 등록 여부).');
        }, 8000);

        mapState.clusterer = new kakao.maps.MarkerClusterer({
          map, averageCenter: true, minLevel: MAP_CLUSTER_MIN_LEVEL, disableClickZoom: false
        });

        // 확대/이동이 끝날 때마다 이름표를 다시 계산한다 (드래그 중에는 뜨지 않는다)
        kakao.maps.event.addListener(map, 'idle', updateMapLabels);

        mapState.inited = true;
        setMapData(data);
        // 카드가 막 펼쳐진 직후라 컨테이너 크기가 아직 안 잡혔을 수 있다. 그 상태로 만들면
        // 지도 영역 계산이 어긋나 이름표가 하나도 안 붙는다. 레이아웃이 끝난 뒤 한 번 더 맞춘다.
        setTimeout(() => {
          if (!mapState.map) return;
          mapState.map.relayout();
          mapState.map.setCenter(new kakao.maps.LatLng(cLat, cLng));
          updateMapLabels();
        }, 250);
      } catch (e) {
        mapFail('지도 초기화 실패: ' + e.message);
      }
    }

    // 마커를 (다시) 만든다. 캐시로 먼저 그린 뒤 최신 데이터가 도착하면 이 함수로 갈아끼운다.
    function setMapData(data) {
      if (!mapState.map) return;
      mapState.data = data;

      if (mapState.clusterer) mapState.clusterer.clear();
      mapState.markers.forEach(m => m.marker.setMap(null));
      clearMapLabels();

      mapState.markers = data.points.map(p => {
        const info = mapBranchInfo(p.k);
        const parts = String(p.k || '').split('|');
        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(p.lat, p.lng),
          image: mapMarkerImage(p.v),
          title: info ? info.은행명 + ' ' + info.지점명 : ''
        });
        kakao.maps.event.addListener(marker, 'click', () => showMapInfo(p, mapBranchInfo(p.k)));
        return {
          key: p.k, marker, v: p.v,
          // 지점 목록을 아직 못 받았어도 이름표가 비지 않도록 키에서 뽑아 쓴다
          bank: info ? info.은행명 : (parts[0] || ''),
          branch: info ? info.지점명 : (parts[1] || '')
        };
      });

      // 은행 필터 채우기 (지도에 실제로 찍힌 은행만)
      const banks = [...new Set(mapState.markers.map(m => m.bank).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'ko'));
      const sel = document.getElementById('mapBankSelect');
      const keep = sel.value;
      sel.innerHTML = '<option value="">전체 은행</option>' +
        banks.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
      if (keep && banks.indexOf(keep) !== -1) sel.value = keep;
      else mapState.bank = '';

      applyMapFilter();
    }

    // 지금 필터 조건에서 이 마커를 보여줘야 하는지
    function mapMarkerPasses(m) {
      const bankOk = !mapState.bank || m.bank === mapState.bank;
      let stateOk = true;
      // 통화·제안서만 한 곳(v=1)은 아직 가봐야 하므로 '미방문만'에 포함시킨다.
      if (mapState.viewFilter === 'unvisited') stateOk = m.v < 2;
      else if (mapState.viewFilter === 'visited') stateOk = m.v === 2;
      return bankOk && stateOk;
    }

    function clearMapLabels() {
      mapState.labels.forEach(o => o.setMap(null));
      mapState.labels = [];
    }

    // 화면에 보이는 마커에만 이름표를 붙인다. 축소 상태에서는 붙이지 않는다(글자가 겹쳐 못 읽음).
    function updateMapLabels() {
      if (!mapState.inited) return;
      clearMapLabels();

      const zoomedEnough = mapState.map.getLevel() <= MAP_LABEL_MAX_LEVEL;
      const hint = document.getElementById('mapZoomHint');
      if (hint) hint.style.display = zoomedEnough ? 'none' : 'block';
      if (!zoomedEnough) return;

      const bounds = mapState.map.getBounds();
      const picked = [];
      for (const m of mapState.markers) {
        if (!mapMarkerPasses(m)) continue;
        if (!bounds.contain(m.marker.getPosition())) continue;
        picked.push(m);
        if (picked.length >= MAP_LABEL_MAX_COUNT) break;
      }

      picked.forEach(m => {
        const el = document.createElement('div');
        el.className = 'map-label' + (m.v === 2 ? ' done' : m.v === 1 ? ' called' : '');
        el.innerHTML = `<span class="bk">${escapeHtml(m.bank)}</span>${escapeHtml(m.branch)}`;
        const ov = new kakao.maps.CustomOverlay({
          position: m.marker.getPosition(), content: el,
          xAnchor: 0, yAnchor: 0.5, zIndex: 1, clickable: false
        });
        ov.setMap(mapState.map);
        mapState.labels.push(ov);
      });
    }

    function applyMapFilter() {
      if (!mapState.inited) return;
      const visible = [];
      mapState.markers.forEach(m => {
        if (mapMarkerPasses(m)) visible.push(m.marker);
        else m.marker.setMap(null);
      });
      mapState.clusterer.clear();
      mapState.clusterer.addMarkers(visible);

      // 숫자는 필터와 무관하게 은행 범위 전체 기준으로 보여준다(무엇을 걸렀는지 알 수 있도록).
      const shown = mapState.markers.filter(m => (!mapState.bank || m.bank === mapState.bank));
      const left = shown.filter(m => m.v === 0).length;
      const called = shown.filter(m => m.v === 1).length;
      const done = shown.filter(m => m.v === 2).length;
      const missing = (mapState.data && mapState.data.missing) ? mapState.data.missing.length : 0;

      let note = `미방문 ${left}곳`;
      if (called) note += ` · 통화만 ${called}곳`;
      note += ` · 방문 ${done}곳 / 전체 ${shown.length}곳`;
      if (mapState.viewFilter === 'unvisited') note = '[미방문만 보는 중] ' + note;
      else if (mapState.viewFilter === 'visited') note = '[방문만 보는 중] ' + note;
      if (missing) note += `  (위치 미등록 ${missing}곳은 표시되지 않음)`;
      document.getElementById('mapNote').textContent = note;

      updateMapLabels();
    }

    // 지점을 누르면 판매자 상세를 팝업으로 띄운다. 입력해 둔 5개 항목은 양이 많아
    // 지도 데이터에 미리 싣지 않고, 누른 지점 것만 그때 받아온 뒤 세션 동안 재사용한다.
    const FIELD_LABELS = [['가족관계','가족관계'],['자택','자택'],['판매성향','판매성향'],
                          ['방문이력','방문이력'],['기타대화내용','기타']];
    const mapDetailCache = {};

    function closeMapDetail() { document.getElementById('mapDetailOverlay').style.display = 'none'; }

    let mapDetailDiag = '';  // 원인 파악용 임시 표시 (해결되면 제거)
    let mapLogTarget = null; // 팝업이 현재 다루는 지점 (방문 입력 대상)

    function renderMapDetail(sellers) {
      const body = document.getElementById('mapDetailBody');
      if (!sellers || !sellers.length) {
        body.innerHTML = '<div class="md-empty">등록된 판매자가 없습니다.</div>' +
          (mapDetailDiag ? `<div style="font-size:10.5px;color:#94a3b8;margin-top:8px;word-break:break-all;">${escapeHtml(mapDetailDiag)}</div>` : '');
        return;
      }
      body.innerHTML = sellers.map(s => {
        const fields = FIELD_LABELS.map(([key, label]) => {
          const v = (s[key] || '').trim();
          return `<div class="md-field${v ? '' : ' empty'}">` +
                 `<span class="lbl">${label}</span>` +
                 `<span class="val">${v ? escapeHtml(v) : '정보 없음'}</span></div>`;
        }).join('');
        return `<div class="md-seller">` +
               `<div class="md-seller-name">${escapeHtml(s.판매자명)}` +
               (s.직책 ? `<span class="pos">${escapeHtml(s.직책)}</span>` : '') + `</div>` +
               fields + `</div>`;
      }).join('');
    }

    function showMapInfo(point, info) {
      const overlay = document.getElementById('mapDetailOverlay');
      const head = document.getElementById('mapDetailHead');
      const body = document.getElementById('mapDetailBody');

      const label = point.v === 0 ? '미방문' : point.v === 1 ? '통화·제안서만' : '방문완료';
      const cls = point.v === 2 ? 'visited' : 'unvisited';
      const bank = info ? info.은행명 : '';
      const branch = info ? info.지점명 : '';
      const setHead = (b, n) => {
        head.innerHTML = `<div class="md-title">${escapeHtml(b || '')} ${escapeHtml(n || '')}</div>` +
                         `<span class="branch-chip ${cls}">${label}</span>`;
      };
      setHead(bank, branch || point.k);
      overlay.style.display = 'flex';

      // 방문 입력 버튼이 쓸 대상. 상세 응답이 오면 서버가 확정한 이름으로 갱신된다.
      mapLogTarget = { point: point, bank: bank, branch: branch, setHead: setHead };
      document.getElementById('mapLogDate').value = todayLocalISO();
      document.getElementById('mapLogType').value = '지점방문';
      document.getElementById('mapLogNote').value = '';
      hideStatus(document.getElementById('mapLogStatus'));
      document.getElementById('mapLogBtn').disabled = false;
      document.getElementById('mapVisitList').innerHTML = '';
      if (bank && branch) loadBranchVisits(bank, branch);

      // 저장해둔 상세가 있으면 즉시 보여주고, 뒤에서 조용히 갱신한다.
      const cached = mapDetailCache[point.k] || cacheLoad('detail:' + point.k);
      if (cached && cached.sellers) {
        mapDetailCache[point.k] = cached;
        renderMapDetail(cached.sellers);
        setHead(cached.은행명, cached.지점명);
      } else {
        body.innerHTML = '<div class="md-empty">불러오는 중...</div>';
      }
      const listCount = (info && info.sellers) ? info.sellers.length : -1;

      // 지점키(k)를 항상 함께 보낸다. 프런트 목록이 비어 있어도(부팅 요청 실패 등)
      // 서버가 키만으로 지점을 찾아 상세를 돌려줄 수 있다.
      jsonpRequest(getUrl(), { action: 'branchDetail', bank, branch, key: point.k }, data => {
        if (!data || data.error || !data.sellers) {
          if (cached && cached.sellers) return; // 저장된 내용을 이미 보여줬으면 그대로 둔다
          mapDetailDiag = `진단 B: ${(data && (data.error || data.message)) || '무응답'} / 목록 ${listCount}명 / k=${point.k}`;
          renderMapDetail((info && info.sellers) ? info.sellers : []);
          return;
        }
        if (data.은행명) {
          setHead(data.은행명, data.지점명);
          if (mapLogTarget && mapLogTarget.point.k === point.k) {
            const wasUnknown = !mapLogTarget.bank || !mapLogTarget.branch;
            mapLogTarget.bank = data.은행명;
            mapLogTarget.branch = data.지점명;
            if (wasUnknown) loadBranchVisits(data.은행명, data.지점명);
          }
        }
        if (!data.sellers.length && !(cached && cached.sellers)) {
          mapDetailDiag = `진단 C: 서버 0명 (목록 ${listCount}명) ${data.은행명 || bank} ${data.지점명 || branch}`;
        }
        mapDetailCache[point.k] = data;
        cacheSave('detail:' + point.k, data);
        renderMapDetail(data.sellers);
      });
    }

    // ── 이 지점의 방문 이력 ──────────────────────────────────────────────
    function loadBranchVisits(bank, branch) {
      const el = document.getElementById('mapVisitList');
      if (!bank || !branch) { el.innerHTML = ''; return; }
      el.innerHTML = '<div class="mv-title">방문 이력</div><div class="md-empty">불러오는 중...</div>';
      jsonpRequest(getUrl(), { action: 'branchVisits', bank, branch }, data => {
        if (!data || data.error || !data.visits) {
          el.innerHTML = '<div class="mv-title">방문 이력</div><div class="md-empty">이력을 불러오지 못했습니다.</div>';
          return;
        }
        renderBranchVisits(bank, branch, data.visits);
      });
    }

    function renderBranchVisits(bank, branch, visits) {
      const el = document.getElementById('mapVisitList');
      if (!visits.length) {
        el.innerHTML = '<div class="mv-title">방문 이력</div><div class="md-empty">아직 방문 기록이 없습니다.</div>';
        return;
      }
      el.innerHTML = '<div class="mv-title">방문 이력 ' + visits.length + '건</div>' +
        visits.map(v => {
          const txt = (v.내용 || '').trim();
          return `<div class="mv-item" data-row="${v.row}">
            <div class="mv-head">
              <span class="mv-date">${escapeHtml(v.날짜)}</span>
              <span class="mv-type">${escapeHtml(v.방문유형)}</span>
              <span class="mv-actions">
                <button class="mv-edit-btn">수정</button>
                <button class="mv-del-btn danger">삭제</button>
              </span>
            </div>
            <div class="mv-text${txt ? '' : ' empty'}">${txt ? escapeHtml(txt) : '내용 없음'}</div>
          </div>`;
        }).join('');

      el.querySelectorAll('.mv-item').forEach(item => {
        const row = Number(item.dataset.row);
        const v = visits.find(x => x.row === row);
        item.querySelector('.mv-edit-btn').onclick = () => startEditVisit(item, bank, branch, v);
        item.querySelector('.mv-del-btn').onclick = () => {
          if (!confirm(`${v.날짜} 방문 기록을 삭제할까요?`)) return;
          jsonpRequest(getUrl(), { action: 'deleteVisit', row, bank, branch }, d => {
            if (!d || d.error || d.ok === false) { alert('오류: ' + ((d && (d.error || d.message)) || '삭제하지 못했습니다')); return; }
            loadBranchVisits(bank, branch);
          });
        };
      });
    }

    // 한 건을 그 자리에서 고친다. 저장이 끝나면 목록을 서버 기준으로 다시 그린다.
    function startEditVisit(item, bank, branch, v) {
      if (item.querySelector('.mv-edit')) return; // 이미 편집 중
      const ta = document.createElement('textarea');
      ta.className = 'mv-edit'; ta.rows = 3; ta.value = v.내용 || '';
      const sel = document.createElement('select');
      sel.className = 'mv-edit';
      ['지점방문', '통화', '제안서', '기타'].forEach(t => {
        const o = document.createElement('option'); o.value = t; o.textContent = t;
        if (t === v.방문유형) o.selected = true;
        sel.appendChild(o);
      });
      const save = document.createElement('button');
      save.className = 'btn-primary'; save.style.marginTop = '6px'; save.textContent = '저장';
      const cancel = document.createElement('button');
      cancel.className = 'btn-neutral'; cancel.style.marginTop = '6px'; cancel.textContent = '취소';

      item.querySelector('.mv-text').style.display = 'none';
      item.appendChild(sel); item.appendChild(ta); item.appendChild(save); item.appendChild(cancel);

      cancel.onclick = () => { [sel, ta, save, cancel].forEach(e => e.remove()); item.querySelector('.mv-text').style.display = ''; };
      save.onclick = () => {
        save.disabled = true; save.textContent = '저장 중...';
        jsonpRequest(getUrl(), { action: 'updateVisit', row: v.row, bank, branch, note: ta.value, visitType: sel.value }, d => {
          if (!d || d.error || d.ok === false) {
            save.disabled = false; save.textContent = '저장';
            alert('오류: ' + ((d && (d.error || d.message)) || '저장하지 못했습니다'));
            return;
          }
          loadBranchVisits(bank, branch);
        });
      };
    }

    // 방문 입력 후 지도/대시보드를 화면에서 바로 맞춰준다. 서버 응답(ok)을 받은 뒤에만 반영한다 —
    // 미리 지웠다가 저장이 실패하면 안 간 지점을 다녀온 것으로 오해하게 되고, 그게 이 지도를 만든 이유와 정반대다.
    function applyVisitLocally(key, visitType) {
      const newV = (!visitType || visitType === '지점방문') ? 2 : 1;
      const m = mapState.markers.find(x => x.key === key);
      if (!m || newV <= m.v) return;   // 이미 같거나 더 진행된 상태면 낮추지 않는다
      const wasUnvisited = m.v === 0;
      m.v = newV;
      m.marker.setImage(mapMarkerImage(newV));

      // 지도 데이터와 저장본도 같이 고쳐, 다시 열었을 때 예전 상태로 되돌아가지 않게 한다
      if (mapState.data && mapState.data.points) {
        const p = mapState.data.points.find(x => x.k === key);
        if (p) p.v = newV;
        cacheSave('mapData', mapState.data);
      }
      applyMapFilter();

      // 대시보드는 별도 요청으로 받은 값이라, 갱신 전까지 지도와 숫자가 어긋나 보인다.
      // 이번 달 첫 접촉일 때만 방문/미방문 수를 옮겨준다.
      if (wasUnvisited && m.bank) {
        const cached = cacheLoad('bootstrap');
        const banks = cached && cached.dashboard && cached.dashboard.banks;
        if (banks) {
          const b = banks.find(x => x.은행명 === m.bank);
          if (b && b.미방문 > 0) {
            b.미방문--; b.당월방문++;
            const br = (b.branches || []).find(x => x.지점명 === m.branch);
            if (br) br.visited = true;
            cacheSave('bootstrap', cached);
            applyDashboard(cached.dashboard);
          }
        }
      }
    }

    document.getElementById('mapLogBtn').onclick = function () {
      if (!mapLogTarget) return;
      const statusEl = document.getElementById('mapLogStatus');
      const bank = mapLogTarget.bank, branch = mapLogTarget.branch;
      if (!bank || !branch) { showStatus(statusEl, '지점 정보를 불러오는 중입니다. 잠시 후 다시 눌러주세요.', true); return; }
      const date = document.getElementById('mapLogDate').value || todayLocalISO();
      const visitType = document.getElementById('mapLogType').value;
      const note = document.getElementById('mapLogNote').value.trim();

      this.disabled = true;
      showStatus(statusEl, '입력 중...');
      const key = mapLogTarget.point.k;
      jsonpRequest(getUrl(), { action: 'logVisit', bank, branch, date, visitType, note }, data => {
        document.getElementById('mapLogBtn').disabled = false;
        if (!data || data.error || data.ok === false) {
          showStatus(statusEl, '오류: ' + ((data && (data.error || data.message)) || '저장하지 못했습니다'), true);
          return;
        }
        showStatus(statusEl, `✓ ${data.dateLabel} ${visitType} 입력 완료`);
        document.getElementById('mapLogNote').value = '';
        applyVisitLocally(key, visitType);
        loadBranchVisits(bank, branch);
        if (mapLogTarget && mapLogTarget.point.k === key) {
          mapLogTarget.point.v = (!visitType || visitType === '지점방문') ? 2 : 1;
          const lbl = mapLogTarget.point.v === 2 ? '방문완료' : '통화·제안서만';
          const cls = mapLogTarget.point.v === 2 ? 'visited' : 'unvisited';
          const head = document.getElementById('mapDetailHead');
          const chip = head.querySelector('.branch-chip');
          if (chip) { chip.textContent = lbl; chip.className = 'branch-chip ' + cls; }
        }
      });
    };

    document.getElementById('mapDetailCloseBtn').onclick = closeMapDetail;
    document.getElementById('mapDetailOverlay').onclick = e => {
      if (e.target.id === 'mapDetailOverlay') closeMapDetail(); // 바깥을 누르면 닫힘
    };

    function mapLocateMe() {
      if (!mapState.inited) return;
      if (!navigator.geolocation) { mapFail('이 브라우저는 위치 기능을 지원하지 않습니다.'); return; }
      showStatus(mapStatusEl(), '현재 위치를 찾는 중...');
      navigator.geolocation.getCurrentPosition(pos => {
        hideStatus(mapStatusEl());
        const here = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        if (mapState.myMarker) mapState.myMarker.setMap(null);
        if (mapState.myCircle) mapState.myCircle.setMap(null);
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"><circle cx="9" cy="9" r="6" fill="#2563eb" stroke="#fff" stroke-width="3"/></svg>';
        mapState.myMarker = new kakao.maps.Marker({
          position: here, zIndex: 10,
          image: new kakao.maps.MarkerImage(
            'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
            new kakao.maps.Size(18, 18), { offset: new kakao.maps.Point(9, 9) })
        });
        mapState.myMarker.setMap(mapState.map);
        mapState.myCircle = new kakao.maps.Circle({
          center: here, radius: Math.min(pos.coords.accuracy || 50, 500),
          strokeWeight: 1, strokeColor: '#2563eb', strokeOpacity: 0.6,
          fillColor: '#2563eb', fillOpacity: 0.12
        });
        mapState.myCircle.setMap(mapState.map);
        mapState.map.setCenter(here);
        mapState.map.setLevel(5);
      }, err => {
        // 거부되면 브라우저 설정에서만 되돌릴 수 있다. 재시도 루프를 돌지 않는다.
        mapFail(err.code === 1
          ? '위치 권한이 거부되었습니다. 브라우저 설정에서 허용해주세요.'
          : '현재 위치를 찾지 못했습니다.');
      }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
    }

    document.getElementById('mapOpenBtn').onclick = openMap;
    document.getElementById('mapBankSelect').onchange = function () {
      mapState.bank = this.value; applyMapFilter();
    };
    const MAP_VIEW_BUTTONS = [
      ['mapViewAllBtn', 'all'], ['mapViewUnvisitedBtn', 'unvisited'], ['mapViewVisitedBtn', 'visited']
    ];
    function setMapView(mode) {
      mapState.viewFilter = mode;
      MAP_VIEW_BUTTONS.forEach(([id, m]) => {
        document.getElementById(id).classList.toggle('active', m === mode);
      });
      applyMapFilter();
    }
    MAP_VIEW_BUTTONS.forEach(([id, m]) => {
      document.getElementById(id).onclick = () => setMapView(m);
    });
    document.getElementById('mapLocateBtn').onclick = mapLocateMe;
    document.getElementById('mapFullBtn').onclick = function () {
      mapState.fullscreen = !mapState.fullscreen;
      document.getElementById('mapWrap').classList.toggle('fullscreen', mapState.fullscreen);
      this.textContent = mapState.fullscreen ? '전체화면 해제' : '전체화면';
      // 컨테이너 크기가 바뀌면 relayout을 불러야 한다 (안 하면 예전 크기로 그려진 채 남는다)
      setTimeout(() => mapState.map && mapState.map.relayout(), 50);
    };

    // ─── 첫 화면: 요청 1번으로 내 정보 + 지점목록 + 업무 + 대시보드를 한꺼번에 ────────
    // 예전에는 getMe / listBranches / listTasks / dashboard 를 각각 따로 불러서
    // 앱을 열 때마다 서버 왕복이 4번 일어났다.
    function boot() {
      const url = getUrl();
      if (!url) { dashboardList.textContent = '연결 설정에서 URL을 먼저 입력하세요.'; return; }
      // 토큰이 없으면 로그인 창은 띄우되, 데이터 로딩은 계속한다
      // (사용자목록 시트가 없는 1인 사용 환경에서는 로그인 창이 스스로 닫힌다)
      if (!getStoredToken()) showUserPicker();

      showCachedUserName();

      // 저장된 내용이 있으면 기다리지 않고 즉시 그린다 (체감 0초).
      const cached = cacheLoad('bootstrap');
      if (cached) {
        applyMeResult(cached.me);
        applyBranchList(cached.branches);
        applyTasks(cached.tasks);
        applyDashboard(cached.dashboard);
        setSyncing(true);
      } else {
        dashboardList.textContent = '불러오는 중...';
      }

      jsonpRequest(url, { action: 'bootstrap' }, data => {
        setSyncing(false);
        if (data && data.__net) {
          // 통신 실패. 저장된 내용이 있으면 그대로 두고, 없을 때만 안내한다.
          if (!cached) dashboardList.textContent = '연결이 원활하지 않습니다. 새로고침을 눌러 다시 시도하세요.';
          else setSyncing(false, '갱신 실패 — 마지막으로 받은 정보를 표시하고 있습니다');
          return;
        }
        if (!data || data.error) {
          // 구버전 백엔드(bootstrap 미지원 등)에서는 예전 방식으로 되돌려 동작을 보장한다.
          initUser(); loadBranchList(); loadTasks(); loadDashboard();
          return;
        }
        cacheSave('bootstrap', data);
        applyMeResult(data.me);
        applyBranchList(data.branches);
        applyTasks(data.tasks);
        applyDashboard(data.dashboard);
      });
    }

    // 화면 위쪽에 조용히 표시되는 갱신 상태 (캐시를 보여주는 동안 최신이 아님을 알린다)
    function setSyncing(on, msg) {
      const el = document.getElementById('syncBadge');
      if (!el) return;
      el.textContent = msg || (on ? '갱신 중...' : '');
      el.style.display = (on || msg) ? 'block' : 'none';
    }

    boot();
  </script>
</body>
</html>
