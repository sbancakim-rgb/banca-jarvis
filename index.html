<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>방카 업무효율화 시스템</title>
<link rel="manifest" href="manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1d4ed8" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --bg: #0f172a;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --neutral: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  html {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  input, textarea, select {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, #1e293b 160px, #f1f5f9 160px, #f1f5f9 100%);
    color: var(--text);
    min-height: 100vh;
  }
  header { padding: 28px 20px 16px; text-align: center; color: #fff; }
  header .logo { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .container { max-width: 420px; margin: 0 auto; padding: 0 16px 32px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    margin-top: 16px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.1);
    border: 1.5px solid #cbd5e1;
  }
  .card h3 {
    margin: 0 0 14px;
    font-size: 18px;
    color: var(--text);
    font-weight: 700;
    text-align: center;
  }
  .date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .date-row label { font-size: 12px; color: var(--muted); font-weight: 600; flex: 0 0 auto; white-space: nowrap; }
  .date-row input[type="date"] {
    flex: 1;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 13.5px;
    background: #fff;
    color: var(--text);
  }
  button {
    font-size: 15px;
    font-weight: 600;
    padding: 13px 18px;
    border-radius: 12px;
    border: none;
    color: #fff;
    width: 100%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.05s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.98); opacity: 0.9; }
  .btn-primary { background: var(--primary); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-neutral { background: var(--neutral); }
  .outbox-badge { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 140;
    padding: 8px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700; box-shadow: 0 4px 14px rgba(15,23,42,0.18);
    cursor: pointer; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
  .outbox-badge.busy { background: #dbeafe; color: #1d4ed8; }
  .outbox-badge.wait { background: #fef3c7; color: #92400e; }
  .outbox-badge.fail { background: #fee2e2; color: #b91c1c; }
  .outbox-badge.done { background: #dcfce7; color: #15803d; }
  .ob-item { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 12.5px; }
  .ob-item .ob-msg { color: #b91c1c; font-size: 11.5px; margin-top: 2px; }
  .ob-item .ob-sub { color: var(--muted); font-size: 11px; margin-top: 2px; white-space: pre-wrap; }
  .ob-item .ob-btns { display: flex; gap: 6px; margin-top: 6px; }
  .ob-item .ob-btns button { width: auto; padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .pending-tag { font-size: 10.5px; color: #1d4ed8; font-weight: 600; margin-left: 4px; }
  .mv-item.pending { border-style: dashed; background: #f8fafc; }
  .status-box {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    background: #f8fafc;
    border-radius: 10px;
    padding: 10px 12px;
    display: none;
  }
  .status-box.visible { display: block; }
  .select-row { display: flex; gap: 8px; }
  .select-row select {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 13.5px;
    background: #fff;
    color: var(--text);
    min-width: 0;
  }
  .sel-full { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border); font-size: 13.5px; background: #fff; color: var(--text); margin-top: 8px; }
  .field-group { margin-bottom: 12px; }
  .field-group:last-of-type { margin-bottom: 0; }
  .field-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 5px;
    border-left: 3px solid var(--primary);
    padding-left: 7px;
  }
  .field-group textarea {
    width: 100%;
    font-size: 14px;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #f8fafc;
    color: var(--text);
    resize: none;
    min-height: 38px;
    font-family: inherit;
    line-height: 1.5;
    overflow-y: hidden;
  }
  .field-group textarea:focus { outline: 2px solid var(--primary); border-color: transparent; background: #fff; }
  .field-group textarea.has-data { background: #fff; border-color: #bfdbfe; }
  .field-group .field-tag { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .seller-meta { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 12px; padding: 8px 12px; background: #eff6ff; border-radius: 8px; }

  /* 이름/직책 수정 details: 검은 삼각형 마커 제거 */
  #sellerEditDetails summary { list-style: none; }
  #sellerEditDetails summary::-webkit-details-marker { display: none; }
  #sellerEditDetails summary::marker { content: ''; }

  /* 달력 */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav button { width: auto; padding: 8px 14px; font-size: 14px; }
  .cal-title { font-size: 15px; font-weight: 700; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    background: #f8fafc;
    color: var(--text);
    cursor: pointer;
    border: 1px solid transparent;
  }
  .cal-cell.empty { background: transparent; cursor: default; }
  .cal-cell.selected { background: var(--primary); color: #fff; }
  .cal-cell.has-visit { border-color: var(--primary); }
  .cal-cell.weekend { color: var(--danger); }
  .cal-cell.selected.weekend { color: #fff; }
  .cal-cell.today { background: #1e293b; color: #fff; font-weight: 800; box-shadow: 0 0 0 2px #1e293b; }
  .cal-cell.today.selected { background: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
  .cal-day-label { font-size: 11px; color: var(--muted); text-align: center; }
  .cal-day-label.weekend { color: var(--danger); }
  #calendarResult { margin-top: 14px; }
  .visit-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 13.5px; line-height: 1.5;
  }
  .visit-item:last-child { border-bottom: none; }
  .visit-num { font-size: 12px; font-weight: 700; color: var(--primary); min-width: 18px; padding-top: 1px; }
  .visit-text { flex: 1; }
  .visit-seller { font-size: 12px; color: var(--muted); }
  .visit-type-tag { font-weight: 300; color: var(--muted); font-size: 12.5px; }
  .visit-delete-btn {
    width: 26px; height: 26px; flex-shrink: 0; padding: 0; margin-top: 1px;
    border-radius: 8px; border: 1px solid var(--border); background: #fff;
    color: var(--danger); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* 대시보드 */
  .dash-bank { margin-bottom: 16px; }
  .dash-bank:last-child { margin-bottom: 0; }
  .dash-bank-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; cursor: pointer; }
  .dash-bar-track { position: relative; height: 22px; border-radius: 8px; background: #fee2e2; overflow: hidden; }
  .dash-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #16a34a; border-radius: 8px 0 0 8px; }
  .dash-bar-label { position: relative; z-index: 1; font-size: 11px; line-height: 22px; padding: 0 8px; color: #fff; font-weight: 700; text-shadow: 0 1px 1px rgba(0,0,0,0.25); }
  .dash-stats { display: flex; gap: 12px; margin-top: 4px; font-size: 11px; color: var(--muted); }
  .dash-summary { margin-bottom: 16px; }
  .dash-summary-numbers { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .dash-summary-item { text-align: center; flex: 1; }
  .dash-summary-item .num { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .dash-summary-item .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .dash-summary-item.total .num { color: #1e293b; }
  .dash-summary-item.visited .num { color: #16a34a; }
  .dash-summary-item.unvisited .num { color: #dc2626; }
  .dash-summary-track { position: relative; height: 10px; border-radius: 6px; background: #fee2e2; overflow: hidden; }
  .dash-summary-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #16a34a; border-radius: 6px 0 0 6px; }
  .dash-summary-pct { text-align: right; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .dash-summary-extra { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--text); }
  .dash-summary-extra b { color: var(--primary); }
  .branch-detail { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .branch-chip { font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
  .branch-chip.visited { background: #dbeafe; color: #1d4ed8; }
  .branch-chip.unvisited { background: #fee2e2; color: #b91c1c; }
  .branch-chip.low { background: #e2e8f0; color: #475569; margin-left: 4px; }
  .branch-chip.lowun { background: #e2e8f0; color: #64748b; }
  .dash-legend { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; font-size: 10.5px; color: var(--muted); margin-bottom: 2px; }
  .dash-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
  .md-prio { width: auto; margin-left: 6px; padding: 4px 9px; font-size: 11px; border-radius: 999px; background: #eef2f7; color: var(--muted); }

  /* 지도 */
  .map-controls { display: flex; gap: 6px; margin-bottom: 8px; }
  .map-controls select { flex: 1; }
  .map-canvas {
    width: 100%; height: 62vh; min-height: 320px; border-radius: 12px;
    overflow: hidden; border: 1px solid var(--border); background: #eef2f7;
  }
  .map-wrap.fullscreen {
    position: fixed; inset: 0; z-index: 200; background: var(--card);
    padding: 10px; margin: 0; border-radius: 0; overflow-y: auto;
  }
  .map-wrap.fullscreen .map-canvas { height: calc(100vh - 132px); }
  .map-legend {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;
    font-size: 11.5px; color: var(--muted); align-items: center; justify-content: center;
  }
  .map-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .map-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .map-dot.unvisited { background: #fde047; border: 2px solid #b91c1c; }
  .map-dot.called { background: #fde047; border: 2px dashed #b91c1c; }
  .map-dot.visited { background: #fde047; border: 2px solid #1d4ed8; }
  .map-note { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: center; }
  /* 마커 옆 지점 이름표. 확대했을 때 화면에 보이는 것만 붙인다 */
  .map-label {
    margin-left: 13px; padding: 2px 6px; white-space: nowrap; pointer-events: none;
    background: rgba(255,255,255,0.93); border: 1px solid #cbd5e1; border-radius: 6px;
    font-size: 11px; font-weight: 700; color: #b91c1c;
    box-shadow: 0 1px 2px rgba(15,23,42,0.15);
  }
  .map-label .bk { font-weight: 500; color: var(--muted); margin-right: 3px; }
  .map-label.called { color: #b91c1c; border-style: dashed; }
  .map-label.done { color: #1d4ed8; font-weight: 600; opacity: 0.8; }
  /* 지점 상세 팝업 */
  .md-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .md-seller { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 10px; background: #f8fafc; }
  .md-seller-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
  .md-seller-name .pos { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .md-field { font-size: 13px; line-height: 1.55; margin-top: 5px; }
  .md-field .lbl { display: inline-block; min-width: 62px; font-weight: 700; color: var(--primary); }
  .md-field .val { white-space: pre-wrap; }
  .md-field.empty .val { color: #cbd5e1; }
  .md-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 14px 0; }
  .md-log { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .md-log-row { display: flex; gap: 6px; }
  .md-log-row input, .md-log-row select { flex: 1; min-width: 0; padding: 9px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; }
  #mapLogNote { width: 100%; margin-top: 6px; padding: 9px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; font-family: inherit; resize: vertical; }
  .mv-title { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
  .mv-item { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 12.5px; background: #fff; }
  .mv-head { display: flex; align-items: center; gap: 6px; }
  .mv-date { font-weight: 700; }
  .mv-type { font-size: 10.5px; padding: 2px 6px; border-radius: 999px; background: #eef2f7; color: var(--muted); }
  .mv-actions { margin-left: auto; display: flex; gap: 4px; }
  .mv-actions button { width: auto; padding: 4px 8px; font-size: 11px; border-radius: 8px; background: #eef2f7; color: var(--muted); }
  .mv-actions button.danger { background: #fee2e2; color: #b91c1c; }
  .mv-text { margin-top: 4px; white-space: pre-wrap; line-height: 1.5; }
  .mv-text.empty { color: #cbd5e1; }
  .mv-edit { width: 100%; margin-top: 6px; padding: 8px; border-radius: 8px; border: 1px solid var(--primary); font-size: 12.5px; font-family: inherit; resize: vertical; }

  /* 업무 LIST */
  .task-target-toggle { display: flex; gap: 8px; }
  .task-toggle-btn {
    flex: 1; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: #f8fafc; color: var(--muted); font-size: 13px; font-weight: 600;
    cursor: pointer; width: auto;
  }
  .task-toggle-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .task-item {
    background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-top: 8px; font-size: 13.5px; line-height: 1.5;
  }
  .task-item.alarm-due { border-color: var(--danger); background: #fef2f2; }
  .task-item-top { display: flex; align-items: flex-start; gap: 8px; }
  .task-item-body { flex: 1; }
  .task-item-date { font-size: 11px; color: var(--muted); }
  .task-item-target { font-weight: 700; }
  .task-item-memo { margin-top: 4px; }
  .task-item-actions { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .task-icon-btn {
    width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; color: var(--text); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .task-item-bottom { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .task-complete-btn { width: auto; padding: 7px 14px; font-size: 12.5px; background: var(--primary); }
  .task-done-details { margin-top: 14px; }
  .task-done-details summary { font-size: 13px; color: var(--muted); cursor: pointer; padding: 6px 0; }
  .task-done-item {
    font-size: 12.5px; color: var(--text); padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .task-done-item:last-child { border-bottom: none; }
  .task-done-item .task-item-date { color: var(--muted); }

  /* 접었다 펼치는 카드 */
  details.fold-card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 18px; font-weight: 700; color: var(--text); }
  details.fold-card > summary::-webkit-details-marker { display: none; }
  details.fold-card > summary::after { content: '▾'; display: inline-block; font-size: 13px; color: var(--muted); transition: transform 0.15s; }
  details.fold-card:not([open]) > summary::after { transform: rotate(-90deg); }
  .fold-badge { font-size: 11.5px; font-weight: 600; color: var(--muted); background: #eef2f7; border-radius: 999px; padding: 2px 8px; }
  .fold-badge:empty { display: none; }
  .fold-body { margin-top: 14px; }
  /* 제안서 관리 */
  .prop-form-title { font-size: 12.5px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
  .prop-form-title.editing { color: #b45309; }
  .prop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .prop-grid input, .prop-grid select, #propNote {
    width: 100%; min-width: 0; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 13.5px; background: #fff; color: var(--text); font-family: inherit; }
  .prop-grid .prop-date { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .prop-grid .prop-date input { flex: 1; }
  .prop-amount-hint { grid-column: 1 / -1; font-size: 11px; color: var(--muted); margin-top: -2px; min-height: 0; }
  .prop-amount-hint:empty { display: none; }
  #propNote { margin-top: 6px; resize: vertical; }
  .prop-stats { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin: 14px 0 4px; }
  .prop-stats b { color: var(--text); }
  .prop-sort { display: flex; gap: 6px; margin-top: 8px; }
  .prop-sort button { padding: 6px 10px; font-size: 12px; }
  .prop-item { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: 13.5px; line-height: 1.5; }
  .prop-item.overdue { border-color: #fca5a5; }
  .prop-item-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .prop-cust { font-weight: 700; }
  .prop-chance { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .prop-chance.c-상 { background: #dcfce7; color: #15803d; }
  .prop-chance.c-중 { background: #fef3c7; color: #b45309; }
  .prop-chance.c-하 { background: #e2e8f0; color: #475569; }
  .prop-dday { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--primary); }
  .prop-dday.past { color: var(--danger); }
  .prop-sub { font-size: 12.5px; color: var(--muted); }
  .prop-amount { font-weight: 700; color: var(--text); }
  .prop-note { margin-top: 4px; white-space: pre-wrap; }
  .prop-del-item { font-size: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--text); }
  .prop-del-item:last-child { border-bottom: none; }
  details.settings { margin-top: 24px; }
  details.settings summary { text-align: center; font-size: 11px; color: #94a3b8; cursor: pointer; padding: 8px; }
  details.settings input { width: 100%; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #f8fafc; }
</style>
</head>
<body>
  <header>
    <div class="logo">방카 업무효율화 시스템</div>
    <div id="userBadge" style="font-size:13px;opacity:0.8;margin-top:4px;"></div>
  </header>

  <!-- 로그인 오류 배너 -->
  <div id="loginError" style="display:none;background:#dc2626;color:#fff;text-align:center;padding:12px 16px;font-size:14px;"></div>
  <div id="syncBadge" style="display:none;text-align:center;font-size:11px;color:#cbd5e1;padding:5px 0 0;"></div>

  <script>
    // ─── 공통 유틸 ───────────────────────────────────────────────────────────
    const HARDCODED_URL = 'https://script.google.com/macros/s/AKfycbyo3aaLvJjbYE2_XmabUyybIDj4ZVST0EJoIJzPPj8gyBb4D2sm2yigCtHZ7T9EbalE/exec';
    const urlInput = document.getElementById('webAppUrl');
    urlInput.value = localStorage.getItem('webAppUrl') || '';
    urlInput.addEventListener('change', () => localStorage.setItem('webAppUrl', urlInput.value));
    function getUrl() { return urlInput.value.trim() || HARDCODED_URL; }

    // ─── 사용자 인증 (PIN + 서명 토큰) ───────────────────────────────────────
    // 웹앱이 배포자 권한으로 실행되어 Google 계정 자동인식이 불가능하므로,
    // 첫 접속 시 본인 이름 선택 + PIN 입력 → 서버가 서명 토큰 발급 → 기기에 저장 →
    // 모든 요청에 토큰을 실어보냄. 백엔드가 토큰을 검증해 신원을 확정한다.
    function getStoredToken() { return (localStorage.getItem('bancaAuthToken') || '').trim(); }
    function setStoredToken(v) { localStorage.setItem('bancaAuthToken', v); }
    function setStoredName(v) { if (v) localStorage.setItem('bancaUserName', v); }
    function clearStoredToken() {
      localStorage.removeItem('bancaAuthToken');
      localStorage.removeItem('bancaUserName');
      localStorage.removeItem('bancaUserEmail'); // 구버전 잔재 정리
    }

    // 토큰을 지워야 하는 경우는 "서버가 이 토큰은 못 쓴다고 확실히 답한 경우"뿐이다.
    // 통신 실패/시간 초과(__net)는 로그인 상태와 무관하므로 절대 로그아웃시키지 않는다.
    const AUTH_FAILURES = new Set(['login_required', 'not_registered', 'invalid_token']);

    function applyMeResult(data) {
      if (!data) return;
      if (data.ok) {
        setStoredName(data.name);
        document.getElementById('userBadge').textContent = data.name + ' 님';
        return;
      }
      if (data.__net || data.error === 'no_users_sheet') {
        // 일시적 통신 문제이거나 다중사용자 미설정 환경 → 그대로 진행 (로그아웃 금지)
        return;
      }
      if (AUTH_FAILURES.has(data.error)) {
        clearStoredToken();
        showUserPicker(data.error === 'not_registered'
          ? '등록되지 않은 계정입니다. 다시 로그인하세요.' : '다시 로그인해주세요.');
      }
      // 그 밖의 서버 오류는 일시적일 수 있으므로 로그인 상태를 유지한다.
    }

    // 저장해 둔 이름을 먼저 보여줘서, 서버 응답을 기다리는 동안 화면이 비어 보이지 않게 한다.
    function showCachedUserName() {
      const cached = localStorage.getItem('bancaUserName');
      if (cached && getStoredToken()) document.getElementById('userBadge').textContent = cached + ' 님';
    }

    function initUser() {
      if (!getStoredToken()) { showUserPicker(); return; }
      showCachedUserName();
      jsonpRequest(getUrl(), { action: 'getMe' }, applyMeResult);
    }

    function showUserPicker(msg) {
      const overlay = document.getElementById('userPickerOverlay');
      const select = document.getElementById('userPickerSelect');
      const pinInput = document.getElementById('userPickerPin');
      const hintEl = document.getElementById('userPickerHint');
      const msgEl = document.getElementById('userPickerMsg');
      msgEl.textContent = msg || '';
      overlay.style.display = 'flex';
      jsonpRequest(getUrl(), { action: 'listUsers' }, data => {
        if (data.ok && data.users) {
          select.innerHTML = '<option value="">— 이름 선택 —</option>' +
            data.users.map(u => '<option value="' + escapeHtml(u.email) + '">' +
              escapeHtml(u.name || u.email) + '</option>').join('');
        } else if (data.error === 'no_users_sheet') {
          overlay.style.display = 'none'; // 다중사용자 미설정 환경은 그냥 통과
        } else {
          msgEl.textContent = '사용자 목록을 불러오지 못했습니다.';
        }
      });
      function doLogin() {
        const email = select.value.trim();
        const pin = pinInput.value.trim();
        if (!email) { msgEl.textContent = '이름을 선택하세요.'; return; }
        if (!pin) { msgEl.textContent = 'PIN을 입력하세요.'; return; }
        msgEl.style.color = 'var(--muted,#666)';
        msgEl.textContent = '확인 중...';
        jsonpRequest(getUrl(), { action: 'login', email: email, pin: pin }, res => {
          msgEl.style.color = 'var(--danger,#dc2626)';
          if (res.ok) {
            setStoredToken(res.token);
            setStoredName(res.name);
            pinInput.value = '';
            overlay.style.display = 'none';
            if (res.firstTime) {
              alert('PIN이 설정되었습니다. 다음부터는 이 PIN으로 로그인하세요.');
            }
            boot(); // 로그인 직후에도 첫 화면 데이터를 한 번에 불러온다
          } else if (res.error === 'wrong_pin') {
            msgEl.textContent = 'PIN이 올바르지 않습니다.';
          } else if (res.error === 'set_pin') {
            hintEl.textContent = '최초 로그인입니다. 사용할 PIN(숫자 4자리 이상)을 정해 입력하세요.';
            msgEl.textContent = 'PIN을 입력해 설정하세요.';
          } else if (res.error === 'pin_too_short') {
            msgEl.textContent = 'PIN은 숫자 4자리 이상이어야 합니다.';
          } else if (res.error === 'not_registered') {
            msgEl.textContent = '등록되지 않은 계정입니다. 관리자에게 문의하세요.';
          } else {
            msgEl.textContent = '로그인에 실패했습니다. 다시 시도하세요.';
          }
        });
      }
      document.getElementById('userPickerConfirm').onclick = doLogin;
      pinInput.onkeydown = e => { if (e.key === 'Enter') doLogin(); };
    }
    function showLoginError(msg) {
      const el = document.getElementById('loginError');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function todayLocalISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function showStatus(el, text, isError) {
      el.textContent = text;
      el.style.color = isError ? 'var(--danger)' : 'var(--text)';
      el.classList.add('visible');
    }
    function hideStatus(el) { el.classList.remove('visible'); el.textContent = ''; }

    function escapeHtml(s) {
      return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ─── 기기 저장소 캐시 ────────────────────────────────────────────────────
    // Apps Script 웹앱은 아무 일도 안 하는 응답조차 왕복에 1.8초가 든다(측정치).
    // 서버를 더 빠르게 만들 방법이 없으므로, 마지막으로 받은 내용을 기기에 저장해두고
    // 앱을 열면 즉시 그것을 그린 뒤 뒤에서 조용히 갱신한다.
    const CACHE_VERSION = 'v1';
    function cacheKey(name) {
      const who = (getStoredToken().split('|')[0] || 'anon');
      return `bancaCache:${CACHE_VERSION}:${who}:${name}`;
    }
    function cacheSave(name, data) {
      try { localStorage.setItem(cacheKey(name), JSON.stringify({ t: Date.now(), d: data })); }
      catch (e) { /* 용량 초과 등은 무시 — 캐시는 있으면 좋은 것일 뿐 */ }
    }
    function cacheLoad(name) {
      try {
        const raw = localStorage.getItem(cacheKey(name));
        if (!raw) return null;
        const o = JSON.parse(raw);
        return o && o.d ? o.d : null;
      } catch (e) { return null; }
    }

    let jsonpCounter = 0;
    // Claude 호출이 들어가는 액션은 응답이 오래 걸리므로 대기 시간을 넉넉히 준다.
    const SLOW_ACTIONS = new Set(['record', 'reparse', 'commit', 'query', 'recordForSeller']);

    // 네트워크 오류/시간 초과는 한 번 자동 재시도하고, 그래도 실패하면 __net 표시를 달아
    // "서버가 거절함"과 구분되게 한다. (이 구분이 없어서 잠깐 느릴 때마다 로그아웃됐다)
    function jsonpRequest(baseUrl, params, onData, attempt) {
      attempt = attempt || 0;
      const cbName = 'jsonpCb' + (jsonpCounter++);
      const timeoutMs = SLOW_ACTIONS.has(params.action) ? 90000 : 40000;

      function fail(message) {
        if (attempt < 1) { jsonpRequest(baseUrl, params, onData, attempt + 1); return; }
        onData({ error: message, __net: true });
      }

      const timeout = setTimeout(() => { cleanup(); fail('응답 시간 초과'); }, timeoutMs);
      function cleanup() { clearTimeout(timeout); delete window[cbName]; if (script.parentNode) script.remove(); }
      window[cbName] = data => { cleanup(); onData(data); };
      // 저장된 서명 토큰을 모든 요청에 자동 첨부 (백엔드가 검증해 신원 확정)
      const storedToken = (localStorage.getItem('bancaAuthToken') || '').trim();
      const withAuth = storedToken ? { ...params, token: storedToken } : { ...params };
      const qs = new URLSearchParams({ ...withAuth, callback: cbName }).toString();
      const script = document.createElement('script');
      script.src = baseUrl + (baseUrl.includes('?') ? '&' : '?') + qs;
      script.onerror = () => { cleanup(); fail('요청 실패 (네트워크 또는 URL 확인)'); };
      document.body.appendChild(script);
    }

    // ─── 저장 대기열 ─────────────────────────────────────────────────────────
    // Apps Script는 아무 일도 안 하는 요청도 왕복 1.8초가 든다(측정치). 저장할 때마다 그걸 기다리면
    // 입력이 느릴 수밖에 없다. 그래서 저장은 ① 기기에 먼저 기록하고 ② 화면을 즉시 바꾼 뒤
    // ③ 뒤에서 순서대로 서버에 보낸다.
    // - 기기에 기록해 두므로 앱을 닫거나 신호가 끊겨도 저장이 사라지지 않고, 다시 열면 이어서 보낸다.
    // - 요청마다 고유ID를 붙여, 응답을 못 받아 재전송해도 서버가 한 번만 저장한다.
    // - 앞의 저장이 끝나야 다음 것을 보내므로 순서가 뒤바뀌지 않는다.
    // - 서버가 거절한 저장은 버리지 않고 '저장 실패'로 남겨 확인·재시도할 수 있게 한다.
    const OUTBOX_VERSION = 'v1';
    function outboxOwner() { return getStoredToken().split('|')[0] || ''; }
    function outboxStoreKey(kind) { return 'bancaOutbox:' + OUTBOX_VERSION + ':' + outboxOwner() + ':' + kind; }
    function readJsonList(key) {
      try { const v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }
    let outbox = [], outboxFailed = [], outboxLoadedFor = null;
    let recentOps = [];      // 방금 끝난 저장(5분). 그보다 먼저 출발한 조회 응답이 늦게 와도 화면이 되돌아가지 않게 한다.
    const opWatchers = {};
    let pumpBusy = false, pumpTimer = null, outboxDoneFlash = null;

    function outboxReload() {
      const owner = outboxOwner();
      if (owner === outboxLoadedFor) return;
      outboxLoadedFor = owner;
      outbox = owner ? readJsonList(outboxStoreKey('queue')) : [];
      outboxFailed = owner ? readJsonList(outboxStoreKey('failed')) : [];
      recentOps = [];
      renderOutboxBadge();
    }
    function outboxPersist() {
      if (!outboxLoadedFor) return;
      try {
        localStorage.setItem(outboxStoreKey('queue'), JSON.stringify(outbox));
        localStorage.setItem(outboxStoreKey('failed'), JSON.stringify(outboxFailed));
      } catch (e) { /* 저장 공간 문제는 드물다. 메모리의 대기열로 계속 전송한다 */ }
    }
    function newId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    }
    function localDateLabel(iso) {
      const [y, m, d] = String(iso || todayLocalISO()).split('-').map(Number);
      return iso + '(' + WEEKDAY_NAMES[new Date(y, m - 1, d).getDay()] + ')';
    }

    // 저장을 대기열에 넣는다. 화면 반영은 부른 쪽에서 곧바로 한다.
    function enqueueWrite(action, params, label, meta) {
      outboxReload();
      const op = { id: newId(), action, params, label, meta: meta || {}, tries: 0, at: Date.now() };
      outbox.push(op);
      outboxPersist();
      renderOutboxBadge();
      pumpOutbox();
      return op;
    }
    function onOpDone(opId, fn) { (opWatchers[opId] = opWatchers[opId] || []).push(fn); }
    // 화면에 덧씌워야 할 저장들(오래된 것부터): 방금 끝난 것 + 아직 대기 중인 것
    function pendingOps(action) {
      const now = Date.now();
      recentOps = recentOps.filter(op => now - op.doneAt < 5 * 60 * 1000);
      return recentOps.concat(outbox).filter(op => !action || op.action === action);
    }

    function pumpOutbox() {
      outboxReload();
      clearTimeout(pumpTimer); pumpTimer = null;
      if (pumpBusy || !outbox.length) { renderOutboxBadge(); return; }
      if (!getStoredToken() || !getUrl()) { renderOutboxBadge(); return; } // 누구의 기록인지 모르면 보내지 않는다
      if (navigator.onLine === false) { renderOutboxBadge(); return; }
      pumpBusy = true;
      renderOutboxBadge();
      const op = outbox[0];
      const owner = outboxLoadedFor;
      jsonpRequest(getUrl(), { ...op.params, action: op.action, opId: op.id }, data => {
        pumpBusy = false;
        if (owner !== outboxLoadedFor || outbox[0] !== op) { pumpOutbox(); return; }
        data = data || { error: '무응답', __net: true };
        if (AUTH_FAILURES.has(data.error)) { renderOutboxBadge(); return; } // 다시 로그인하면 이어서 보낸다
        // 통신 실패, 서버 일시 오류(예외)는 재시도. 서버가 명확히 거절(ok:false)한 것은 재시도하지 않는다.
        const transient = data.__net || (data.error && data.ok !== false && data.error !== 'unknown action');
        if (transient) {
          op.tries++;
          if (!data.__net && op.tries >= 8) { finishOp(op, data, data.error); return; }
          outboxPersist(); renderOutboxBadge();
          pumpTimer = setTimeout(pumpOutbox, Math.min(60000, 1500 * Math.pow(2, Math.min(op.tries, 6))));
          return;
        }
        const failed = !!data.error || data.ok === false;
        finishOp(op, data, failed ? String(data.message || data.error || '저장하지 못했습니다') : null);
      });
    }

    function finishOp(op, data, errorMsg) {
      outbox.shift();
      if (errorMsg) outboxFailed.push(Object.assign({}, op, { message: errorMsg, failedAt: Date.now() }));
      else recentOps.push(Object.assign({}, op, { doneAt: Date.now() }));
      outboxPersist();
      if (!errorMsg && !outbox.length) {
        outboxDoneFlash = Date.now();
        setTimeout(renderOutboxBadge, 1600);
      }
      renderOutboxBadge();
      (opWatchers[op.id] || []).forEach(fn => { try { fn(data, errorMsg); } catch (e) {} });
      delete opWatchers[op.id];
      afterOpSettled(op);
      // 거절된 저장은 화면에 미리 반영해 둔 상태가 틀린 것이므로 서버 기준으로 다시 맞춘다.
      if (errorMsg) refreshFromServer();
      pumpOutbox();
    }

    // 저장이 끝나면 '서버 저장 중' 표시를 걷어낸다
    function afterOpSettled(op) {
      try {
        if (/Task/.test(op.action) || op.action === 'reorderTasks') renderTasks(tasksState);
        if (/ProposalItem$/.test(op.action)) renderProposals();
        if (op.action === 'logVisit' && calSelected && op.meta && op.meta.date === calSelected.dateStr &&
            calSelected.cell.classList.contains('selected')) selectCalendarDate(calSelected.dateStr, calSelected.cell);
      } catch (e) {}
    }

    function renderOutboxBadge() {
      const el = document.getElementById('outboxBadge');
      if (!el) return;
      let text = '', cls = '';
      if (outboxFailed.length) {
        text = '⚠ 저장 실패 ' + outboxFailed.length + '건 — 눌러서 확인'; cls = 'fail';
      } else if (outbox.length) {
        const waiting = navigator.onLine === false || !getStoredToken() || outbox[0].tries > 0;
        text = waiting ? '⏳ 저장 대기 ' + outbox.length + '건 · 연결되면 자동 저장' : '↻ 저장 중 ' + outbox.length + '건';
        cls = waiting ? 'wait' : 'busy';
      } else if (outboxDoneFlash && Date.now() - outboxDoneFlash < 1500) {
        text = '✓ 서버 저장 완료'; cls = 'done';
      }
      el.hidden = !text;
      el.textContent = text;
      el.className = 'outbox-badge ' + cls;
    }

    function openOutboxModal() {
      const list = document.getElementById('outboxModalList');
      const when = t => new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      let html = '';
      if (outboxFailed.length) {
        html += '<div style="font-size:12px;color:var(--muted);margin-top:6px;">서버가 받아들이지 않은 저장입니다. 내용을 확인하고 다시 시도하거나 버리세요.</div>';
        html += outboxFailed.map((op, i) => `<div class="ob-item">
            <div><b>${escapeHtml(op.label || op.action)}</b></div>
            <div class="ob-sub">${escapeHtml(when(op.at))}${op.meta && op.meta.summary ? '\n' + escapeHtml(op.meta.summary) : ''}</div>
            <div class="ob-msg">${escapeHtml(op.message || '')}</div>
            <div class="ob-btns"><button class="btn-primary" data-retry="${i}">다시 시도</button><button class="btn-neutral" data-drop="${i}">버리기</button></div>
          </div>`).join('');
      }
      if (outbox.length) {
        html += '<div style="font-size:12px;color:var(--muted);margin-top:10px;">서버로 보내는 중인 저장 (기기에 보관되어 있어 앱을 닫아도 사라지지 않습니다)</div>';
        html += outbox.map(op => `<div class="ob-item"><div>${escapeHtml(op.label || op.action)}</div>
            <div class="ob-sub">${escapeHtml(when(op.at))}${op.tries ? ' · 재시도 ' + op.tries + '회' : ''}</div></div>`).join('');
      }
      if (!html) html = '<div class="md-empty">모든 저장이 서버에 반영되었습니다.</div>';
      list.innerHTML = html;
      list.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => {
        const op = outboxFailed.splice(Number(b.dataset.retry), 1)[0];
        op.tries = 0; delete op.message; delete op.failedAt;
        outbox.push(op); outboxPersist(); pumpOutbox(); openOutboxModal();
      });
      list.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
        if (!confirm('이 저장을 버릴까요? 서버에는 반영되지 않습니다.')) return;
        outboxFailed.splice(Number(b.dataset.drop), 1); outboxPersist(); renderOutboxBadge(); openOutboxModal();
      });
      document.getElementById('outboxModal').style.display = 'flex';
    }

    // ─── 판매자 정보 보관본 ──────────────────────────────────────────────────
    // 내 담당 판매자 정보 전체를 기기에 보관해 두고, 판매자를 고르면 서버를 기다리지 않고 바로 보여준다.
    // 앱을 열 때마다 뒤에서 최신본을 한 번 받아 교체한다.
    // 형식: { '지점키|판매자명': [직책, 가족관계, 자택, 판매성향, 방문이력, 기타대화내용] }
    const SELLER_FIELD_ORDER = ['가족관계', '자택', '판매성향', '방문이력', '기타대화내용'];
    let sellerStore = null, sellerStoreFresh = false;
    function sellerKeyFor(bank, branch, seller) {
      const e = branchListData.find(b => b.은행명 === bank && b.지점명 === branch);
      return e && e.k && seller ? e.k + '|' + seller : null;
    }
    function persistSellerStore() { if (sellerStore) cacheSave('sellers', sellerStore); }
    function applySellerSaveToStore(store, op) {
      const key = op.meta && op.meta.key;
      if (!store || !key) return;
      let d; try { d = JSON.parse(op.params.data); } catch (e) { return; }
      const cur = store[key] || [(op.meta && op.meta.title) || '', '', '', '', '', ''];
      store[key] = [cur[0]].concat(SELLER_FIELD_ORDER.map(k => String(d[k] || '').trim()));
    }
    function loadSellerDump() {
      if (!getStoredToken()) return;
      jsonpRequest(getUrl(), { action: 'sellerDump' }, data => {
        if (!data || data.error || !data.sellers) return;
        const store = data.sellers;
        pendingOps('saveSellerFields').forEach(op => applySellerSaveToStore(store, op));
        sellerStore = store;
        sellerStoreFresh = true;
        persistSellerStore();
        refreshOpenSellerForm();
      });
    }

    // ─── 날짜 입력 초기화 ────────────────────────────────────────────────────
    const WEEKDAY_NAMES = ['일','월','화','수','목','금','토'];
    const visitDateInput = document.getElementById('visitDateInput');
    const visitDateWeekday = document.getElementById('visitDateWeekday');
    visitDateInput.value = todayLocalISO();
    function updateVisitDateWeekday() {
      if (!visitDateInput.value) { visitDateWeekday.textContent = ''; return; }
      const [y,m,d] = visitDateInput.value.split('-').map(Number);
      const dt = new Date(y, m-1, d);
      visitDateWeekday.textContent = '(' + WEEKDAY_NAMES[dt.getDay()] + ')';
    }
    visitDateInput.addEventListener('change', updateVisitDateWeekday);
    updateVisitDateWeekday();

    // ─── 공휴일 (매년 갱신 필요) ─────────────────────────────────────────────

    function isHoliday(dateStr) { return HOLIDAYS.has(dateStr); }

    // ─── 은행/지점/판매자 드롭다운 ───────────────────────────────────────────
    let branchListData = [];

    function makePicker(bankSel, branchSel, sellerSel, sellerPlaceholder, onSellerChange) {
      // 판매자 목록은 listBranches 응답(branchListData)에 이미 들어 있으므로 서버를 다시 부르지 않는다.
      // (예전에는 은행/지점을 바꿀 때마다 listSellers 요청이 한 번씩 더 나가서 드롭다운이 느렸다)
      function updateSellers(done) {
        if (!sellerSel) { if (done) done(); return; }
        const bank = bankSel.value, branch = branchSel.value;
        sellerSel.innerHTML = `<option value="">${sellerPlaceholder}</option>`;
        if (bank && branch) {
          const entry = branchListData.find(b => b.은행명 === bank && b.지점명 === branch);
          const sellers = (entry && entry.sellers) || [];
          if (sellers.length) {
            sellerSel.innerHTML = `<option value="">${sellerPlaceholder}</option>` +
              sellers.map(s => `<option value="${escapeHtml(s.판매자명)}">${escapeHtml(s.판매자명 + (s.직책 ? ' ' + s.직책 : ''))}</option>`).join('');
          }
        }
        if (done) done();
      }
      function updateBranches() {
        const bank = bankSel.value;
        const branches = branchListData.filter(b => !bank || b.은행명 === bank);
        branchSel.innerHTML = '<option value="">지점 선택</option>' +
          branches.map(b => `<option value="${escapeHtml(b.지점명)}">${escapeHtml(b.지점명)}</option>`).join('');
        updateSellers();
      }
      bankSel.addEventListener('change', updateBranches);
      branchSel.addEventListener('change', updateSellers);
      if (sellerSel && onSellerChange) sellerSel.addEventListener('change', onSellerChange);
      return {
        populate() {
          const banks = [...new Set(branchListData.map(b => b.은행명))];
          bankSel.innerHTML = '<option value="">은행 선택</option>' +
            banks.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
          updateBranches();
        },
        setBank(val) { bankSel.value = val; updateBranches(); },
        setBranch(val, done) { branchSel.value = val; updateSellers(done); },
        // 드롭다운에서 특정 판매자를 선택하고 선택 핸들러를 실행
        selectSeller(name) {
          if (!sellerSel) return;
          sellerSel.value = name;
          if (sellerSel.value === name && onSellerChange) onSellerChange();
        }
      };
    }

    const visitPicker = makePicker(
      document.getElementById('visitBankSelect'),
      document.getElementById('visitBranchSelect'),
      null, '', null

    // 판매자 드롭다운 변경 시 기존 정보 로드
    function onSellerSelected() {
      const bank   = document.getElementById('sellerBankSelect').value;
      const branch = document.getElementById('sellerBranchSelect').value;
      const seller = document.getElementById('sellerSelect').value;
      const fieldsDiv  = document.getElementById('sellerFields');
      const loadStatus = document.getElementById('sellerLoadStatus');

      hideStatus(loadStatus);
      if (!seller) { fieldsDiv.style.display = 'none'; return; }

      // 필드 초기화 후 표시
      FIELD_KEYS.forEach(k => {
        const ta = document.getElementById('field_' + k);
        ta.value = '';
        ta.dataset.initial = '';
        ta.classList.remove('has-data');
        autoGrow(ta);
      });
      document.getElementById('sellerMeta').textContent = bank + ' ' + branch + ' · ' + seller;
      fieldsDiv.style.display = 'block';
      hideStatus(document.getElementById('sellerSaveStatus'));

      const url = getUrl();
      if (!url || !bank || !branch) return;

      // 기기에 보관된 정보가 있으면 서버를 기다리지 않고 바로 채운다.
      const key = sellerKeyFor(bank, branch, seller);
      const stored = key && sellerStore ? sellerStore[key] : null;
      document.getElementById('archiveRestoreBox').style.display = 'none';
      if (stored) { fillSellerForm(bank, branch, seller, stored); return; }
      if (key && sellerStore && sellerStoreFresh) { handleNoSellerData(bank, seller); return; }

      showStatus(loadStatus, '기존 정보 불러오는 중...');
      jsonpRequest(url, { action: 'getSellerInfo', bank, branch, seller }, data => {
        hideStatus(loadStatus);
        document.getElementById('archiveRestoreBox').style.display = 'none';
        if (data.error) { showStatus(loadStatus, '오류: ' + data.error, true); return; }
        if (data.ok && data.seller) {
          const s = data.seller;
          FIELD_KEYS.forEach(k => {
            const ta = document.getElementById('field_' + k);
            const v = s[k] || '';
            ta.value = v;
            ta.dataset.initial = v;
            if (v) ta.classList.add('has-data');
            autoGrow(ta);
          });
          const title = s.직책 || '';
          if (title) {
            document.getElementById('sellerMeta').textContent = bank + ' ' + branch + ' · ' + seller + ' ' + title;
            document.getElementById('editTitleInput').value = title;
          }
        } else {
          handleNoSellerData(bank, seller);
        }
      });
    }

    // 데이터 없는 신규 판매자 → 이전 담당자 정보 탐색
    function handleNoSellerData(bank, seller) {
      const selectedOpt = document.getElementById('sellerSelect').selectedOptions[0];
      const titleFromDropdown = selectedOpt ? (selectedOpt.textContent.replace(seller, '').trim()) : '';
      if (titleFromDropdown) document.getElementById('editTitleInput').value = titleFromDropdown;
      checkArchive(bank, seller, titleFromDropdown);
    }

    function fillSellerForm(bank, branch, seller, stored) {
      SELLER_FIELD_ORDER.forEach((k, i) => {
        const ta = document.getElementById('field_' + k);
        const v = stored[i + 1] || '';
        ta.value = v;
        ta.dataset.initial = v;
        ta.classList.toggle('has-data', !!v);
        autoGrow(ta);
      });
      const title = stored[0] || '';
      document.getElementById('sellerMeta').textContent = bank + ' ' + branch + ' · ' + seller + (title ? ' ' + title : '');
      if (title) document.getElementById('editTitleInput').value = title;
    }

    // 최신 보관본이 도착했을 때, 열려 있는 판매자 폼을 아직 고치지 않았다면 최신 내용으로 바꿔 보여준다.
    function refreshOpenSellerForm() {
      if (document.getElementById('sellerFields').style.display === 'none') return;
      const bank = document.getElementById('sellerBankSelect').value;
      const branch = document.getElementById('sellerBranchSelect').value;
      const seller = document.getElementById('sellerSelect').value;
      const key = sellerKeyFor(bank, branch, seller);
      const stored = key && sellerStore ? sellerStore[key] : null;
      if (!stored) return;
      const dirty = SELLER_FIELD_ORDER.some(k => {
        const ta = document.getElementById('field_' + k);
        return ta.value !== (ta.dataset.initial || '');
      });
      if (!dirty) fillSellerForm(bank, branch, seller, stored);
    }

    // 판매자 정보가 바뀌었을 때 지도 팝업의 보관본도 같이 고친다(다시 열었을 때 옛 내용이 보이지 않게).
    function syncMapDetailSeller(key, fields) {
      if (!key) return;
      const cut = key.lastIndexOf('|');
      const branchK = key.slice(0, cut), name = key.slice(cut + 1);
      const d = mapDetailCache[branchK] || cacheLoad('detail:' + branchK);
      if (!d || !d.sellers) return;
      const s = d.sellers.find(x => x.판매자명 === name);
      if (!s) return;
      Object.assign(s, fields);
      mapDetailCache[branchK] = d;
      cacheSave('detail:' + branchK, d);
    }

    // 판매자 정보 저장(판매자 카드/지도 팝업 공용). 기기 보관본과 화면은 즉시 바뀌고 서버 저장은 뒤에서 한다.
    function queueSellerSave(bank, branch, seller, payload, title) {
      const key = sellerKeyFor(bank, branch, seller);
      const summary = SELLER_FIELD_ORDER.map(k => payload[k] ? k + ': ' + payload[k] : '').filter(Boolean).join('\n');
      const op = enqueueWrite('saveSellerFields', { data: JSON.stringify(payload) },
        '판매자 정보 · ' + bank + ' ' + branch + ' ' + seller, { key, title: title || '', summary });
      if (!sellerStore) sellerStore = {};
      applySellerSaveToStore(sellerStore, op);
      persistSellerStore();
      const fields = {};
      SELLER_FIELD_ORDER.forEach(k => { fields[k] = payload[k]; });
      syncMapDetailSeller(key, fields);
      return op;
    }

    const sellerPicker = makePicker(
      document.getElementById('sellerBankSelect'),
      document.getElementById('sellerBranchSelect'),
      document.getElementById('sellerSelect'),
      '판매자 선택',
      onSellerSelected
    );

    const taskPicker = makePicker(
      document.getElementById('taskBankSelect'),
      document.getElementById('taskBranchSelect'),
      document.getElementById('taskSellerSelect'),
      '판매자 선택(선택 안 해도 됨)',
      null
    );

    const propPicker = makePicker(
      document.getElementById('propBankSelect'),
      document.getElementById('propBranchSelect'),
      document.getElementById('propSellerSelect'),
      '판매자 선택(선택 안 해도 됨)',
      null
    );

    const taskEditPicker = makePicker(
      document.getElementById('taskEditBankSelect'),
      document.getElementById('taskEditBranchSelect'),
      document.getElementById('taskEditSellerSelect'),
      '판매자 선택(선택 안 해도 됨)',
      null
    );

    // 은행/지점 바뀌면 판매자 필드 숨김
    ['sellerBankSelect','sellerBranchSelect'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => {
        document.getElementById('sellerFields').style.display = 'none';
        hideStatus(document.getElementById('sellerLoadStatus'));
      });
    });

    const FIELD_KEYS = ['가족관계','자택','판매성향','방문이력','기타대화내용'];

    // ─── 텍스트박스 자동 높이 조절 (최대 10줄, 이후 스크롤) ────────────────────
    function autoGrow(ta) {
      ta.style.height = 'auto';
      const style = getComputedStyle(ta);
      const lineHeight = parseFloat(style.lineHeight) || 21;
      const paddingV = (parseFloat(style.paddingTop)||0) + (parseFloat(style.paddingBottom)||0);
      const borderV = (parseFloat(style.borderTopWidth)||0) + (parseFloat(style.borderBottomWidth)||0);
      const maxHeight = lineHeight * 10 + paddingV + borderV;
      const needed = ta.scrollHeight;
      ta.style.height = Math.min(needed, maxHeight) + 'px';
      ta.style.overflowY = needed > maxHeight ? 'auto' : 'hidden';
    }
    FIELD_KEYS.forEach(k => {
      const ta = document.getElementById('field_' + k);
      ta.addEventListener('input', () => autoGrow(ta));
    });

    // ─── 저장 시 (연.월) 태그 자동 기록 ─────────────────────────────────────
    function yearMonthTag() {
      const d = new Date();
      return (d.getFullYear() % 100) + '.' + (d.getMonth() + 1);
    }
    function buildTaggedValue(ta) {
      const val = ta.value.trim();
      const initial = ta.dataset.initial || '';
      if (!val || val === initial) return val;
      const tag = ' (' + yearMonthTag() + ')';
      if (initial && val.startsWith(initial)) {
        const newPart = val.slice(initial.length).replace(/\s+$/, '');
        if (!newPart.trim()) return val;
        if (newPart.includes(tag)) return initial + newPart;
        return initial + newPart + tag;
      }
      return val.endsWith(tag) ? val : val + tag;
    }

    function applyBranchList(data) {
      if (!data || data.error || !data.branches) return;
      branchListData = data.branches;
      visitPicker.populate();
      sellerPicker.populate();
      taskPicker.populate();
      taskEditPicker.populate();
      propPicker.populate();
    }

    function loadBranchList() {
      const url = getUrl();
      if (!url) return;
      jsonpRequest(url, { action: 'listBranches' }, applyBranchList);
    }

    // 판매자 드롭다운은 branchListData(클라이언트 보관)에서 바로 만들어지므로,
    // 판매자를 추가/삭제/이름변경했을 때 이 목록도 같이 고쳐줘야 화면이 어긋나지 않는다.
    function localSellers(bank, branch) {
      const entry = branchListData.find(b => b.은행명 === bank && b.지점명 === branch);
      if (!entry) return null;
      if (!entry.sellers) entry.sellers = [];
      return entry.sellers;
    }
    function localAddSeller(bank, branch, 판매자명, 직책) {
      const list = localSellers(bank, branch);
      if (list && !list.some(s => s.판매자명 === 판매자명)) list.push({ 판매자명, 직책: 직책 || '' });
    }
    function localRemoveSeller(bank, branch, 판매자명) {
      const list = localSellers(bank, branch);
      if (!list) return;
      const i = list.findIndex(s => s.판매자명 === 판매자명);
      if (i >= 0) list.splice(i, 1);
    }
    function localUpdateSeller(bank, branch, 판매자명, patch) {
      const list = localSellers(bank, branch);
      if (!list) return;
      const s = list.find(x => x.판매자명 === 판매자명);
      if (s) Object.assign(s, patch);
    }

    // ─── ① 방문 입력 ─────────────────────────────────────────────────────────
    document.getElementById('logVisitBtn').onclick = () => {
      const url    = getUrl();
      const bank   = document.getElementById('visitBankSelect').value;
      const branch = document.getElementById('visitBranchSelect').value;
      const visitType = document.getElementById('visitTypeSelect').value;
      const date   = visitDateInput.value || todayLocalISO();
      const statusEl = document.getElementById('visitStatus');
      if (!url)            { showStatus(statusEl, '연결 설정에서 URL을 먼저 입력하세요.', true); return; }
      if (!bank || !branch){ showStatus(statusEl, '은행과 지점을 모두 선택해주세요.', true); return; }
      queueVisit(bank, branch, date, visitType, '');
      showStatus(statusEl, `✓ ${localDateLabel(date)}  ${bank} ${branch}  (${visitType})  입력 완료`);
    };

    // 방문 입력(방문 카드/지도 팝업 공용). 지도·대시보드는 즉시 바뀌고 서버 저장은 뒤에서 한다.
    function queueVisit(bank, branch, date, visitType, note) {
      const entry = branchListData.find(b => b.은행명 === bank && b.지점명 === branch);
      const key = (entry && entry.k) || (mapLogTarget && mapLogTarget.bank === bank && mapLogTarget.branch === branch ? mapLogTarget.point.k : null);
      const op = enqueueWrite('logVisit', { bank, branch, date, visitType, note: note || '' },
        '방문 입력 · ' + localDateLabel(date) + ' ' + bank + ' ' + branch + ' (' + visitType + ')',
        { key, bank, branch, date, visitType, note: note || '', summary: note || '' });
      applyVisitLocally(key, visitType, bank, branch, date);
      return op;
    }

    // ─── ② 이름/직책 수정 ────────────────────────────────────────────────────
    function applyArchivedData(candidate) {
      const fields = ['가족관계','자택','판매성향','방문이력','기타대화내용'];
      fields.forEach(k => {
        const ta = document.getElementById('field_' + k);
        const v = candidate[k] || '';
        ta.value = v;
        ta.dataset.initial = v;
        if (v) ta.classList.add('has-data'); else ta.classList.remove('has-data');
        autoGrow(ta);
      });
      document.getElementById('archiveRestoreBox').style.display = 'none';
    }

    function checkArchive(bank, seller, title) {
      const url = getUrl();
      if (!url || !bank || !seller) return;   // 은행+이름만 있으면 조회 (직책은 선택)
      jsonpRequest(url, { action: 'findArchivedSellers', bank, seller, title: title || '' }, data => {
        if (!data.ok || !data.candidates || data.candidates.length === 0) return;
        const box = document.getElementById('archiveRestoreBox');
        const msg = document.getElementById('archiveRestoreMsg');
        const list = document.getElementById('archiveCandidateList');
        const label = c => `${c.지점명 || '지점 미상'}${c.직책 ? ' · ' + c.직책 : ''} · ${c.날짜 || '날짜 미상'}${c.source === '현재' ? ' (현재 담당자 보유)' : ''}`;
        list.innerHTML = '';
        if (data.candidates.length === 1) {
          const c = data.candidates[0];
          msg.textContent = `은행·이름이 같은 판매자 정보가 있습니다 (${label(c)}). 가져올까요?`;
          const btn = document.createElement('button');
          btn.className = 'btn-primary';
          btn.style.cssText = 'width:auto;padding:8px 16px;font-size:13px;';
          btn.textContent = '정보 가져오기';
          btn.onclick = () => applyArchivedData(c);
          list.appendChild(btn);
        } else {
          msg.textContent = `은행·이름이 같은 판매자 정보가 ${data.candidates.length}건 있습니다. 가져올 정보를 선택하세요:`;
          data.candidates.forEach((c, i) => {
            const row = document.createElement('div');
            row.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:6px;';
            const info = document.createElement('span');
            info.style.cssText = 'flex:1;font-size:12px;color:var(--text);';
            info.textContent = `${i+1}. ${label(c)}`;
            const btn = document.createElement('button');
            btn.className = 'btn-primary';
            btn.style.cssText = 'width:auto;padding:6px 12px;font-size:12px;';
            btn.textContent = '가져오기';
            btn.onclick = () => applyArchivedData(c);
            row.appendChild(info);
            row.appendChild(btn);
            list.appendChild(row);
          });
        }
        box.style.display = 'block';
      });
    }

    document.getElementById('saveTitleBtn').onclick = () => {
      const url    = getUrl();
      const bank   = document.getElementById('sellerBankSelect').value;
      const branch = document.getElementById('sellerBranchSelect').value;
      const seller = document.getElementById('sellerSelect').value;
      const newTitle = document.getElementById('editTitleInput').value.trim();
      const statusEl = document.getElementById('editStatus');
      if (!newTitle) { showStatus(statusEl, '새 직책을 입력해주세요.', true); return; }
      showStatus(statusEl, '저장 중...');
      jsonpRequest(url, { action: 'updateSellerTitle', bank, branch, seller, newTitle }, data => {
        if (!data.ok) { showStatus(statusEl, '오류: ' + (data.message || data.error), true); return; }
        showStatus(statusEl, '✓ 직책이 ' + data.newTitle + ' 으로 수정되었습니다.');
        localUpdateSeller(bank, branch, seller, { 직책: data.newTitle });
        const tKey = sellerKeyFor(bank, branch, seller);
        if (tKey && sellerStore && sellerStore[tKey]) { sellerStore[tKey][0] = data.newTitle; persistSellerStore(); }

    function renderCalendar() {
      const base = new Date();
      base.setDate(1);
      base.setMonth(base.getMonth() + calMonthOffset);
      const year = base.getFullYear(), month = base.getMonth();
      calTitle.textContent = year + '년 ' + (month+1) + '월';
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const todayStr = todayLocalISO();
      calGrid.innerHTML = '';
      for (let i = 0; i < firstDay; i++) {
        const e = document.createElement('div'); e.className = 'cal-cell empty'; calGrid.appendChild(e);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('div');
        const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        const dow = new Date(year, month, d).getDay();
        let cls = 'cal-cell';
        if (dow === 0 || dow === 6 || isHoliday(dateStr)) cls += ' weekend';
        if (dateStr === todayStr) cls += ' today';
        cell.className = cls;
        cell.textContent = d;
        cell.onclick = () => selectCalendarDate(dateStr, cell);
        calGrid.appendChild(cell);
      }
    }

    let calSelected = null;
    function selectCalendarDate(dateStr, cell) {
      calSelected = { dateStr, cell };
      document.querySelectorAll('.cal-cell.selected').forEach(c => c.classList.remove('selected'));
      cell.classList.add('selected');
      const url = getUrl();
      if (!url) { calendarResult.textContent = '연결 설정에서 URL을 먼저 입력하세요.'; return; }
      calendarResult.textContent = '불러오는 중...';
      jsonpRequest(url, { action: 'calendarDay', date: dateStr }, data => {
        if (data.error) { calendarResult.textContent = '오류: ' + data.error; return; }
        const pend = outbox.filter(op => op.action === 'logVisit' && op.meta && op.meta.date === dateStr);
        if ((!data.visits || data.visits.length === 0) && !pend.length) {
          calendarResult.textContent = dateStr + ' 방문 기록이 없습니다.'; return;
        }
        data.visits = data.visits || [];
        calendarResult.innerHTML = '';
        const header = document.createElement('div');
        header.style.cssText = 'font-weight:700;margin-bottom:10px;font-size:13.5px;';
        header.textContent = '방문 ' + data.branchCount + '개 지점';
        calendarResult.appendChild(header);

        // 지점별로 묶어서 번호 매기기 (지점 기준으로 넘버링, 판매자는 들여쓰기)
        const branchMap = new Map();
        data.visits.forEach(v => {
          const key = v.은행명 + '|' + v.지점명;
          if (!branchMap.has(key)) branchMap.set(key, { 은행명: v.은행명, 지점명: v.지점명, sellers: [], 방문유형: v.방문유형 });
          if (v.판매자명) branchMap.get(key).sellers.push(v);
        });

        pend.forEach(op => {
          const key = op.meta.bank + '|' + op.meta.branch;
          if (!branchMap.has(key)) branchMap.set(key, { 은행명: op.meta.bank, 지점명: op.meta.branch, sellers: [], 방문유형: op.meta.visitType, pending: true });
        });
        header.textContent = '방문 ' + branchMap.size + '개 지점';

        let num = 1;
        branchMap.forEach(g => {
          const div = document.createElement('div');
          div.className = 'visit-item';
          const numEl = document.createElement('div');
          numEl.className = 'visit-num';
          numEl.textContent = num++ + '.';
          const textEl = document.createElement('div');
          textEl.className = 'visit-text';
          textEl.innerHTML = '<strong>' + escapeHtml(g.은행명 + ' ' + g.지점명) + '</strong>' +
            (g.방문유형 ? ' <span class="visit-type-tag">(' + escapeHtml(g.방문유형) + ')</span>' : '');
          if (g.pending) textEl.innerHTML += '<span class="pending-tag">서버 저장 중</span>';
          if (g.sellers.length > 0) {
            textEl.innerHTML += '<div class="visit-seller">' +
              g.sellers.map(s => escapeHtml(s.판매자명)).join(', ') + '</div>';
          }
          const delBtn = document.createElement('button');
          delBtn.className = 'visit-delete-btn';
          delBtn.textContent = '✕';
          delBtn.title = '방문 기록 삭제';
          delBtn.onclick = () => deleteVisitDay(dateStr, g.은행명, g.지점명, cell);
          div.appendChild(numEl);
          div.appendChild(textEl);
          if (!g.pending) div.appendChild(delBtn);
          calendarResult.appendChild(div);
        });
      });
    }

    function deleteVisitDay(dateStr, bank, branch, cell) {

    const dashboardList    = document.getElementById('dashboardList');

    // 이번 달 1일부터 오늘까지 경과된 영업일수(주말/공휴일 제외) 계산
    function countElapsedBusinessDays() {
      const now = new Date();
      const year = now.getFullYear(), month = now.getMonth(), today = now.getDate();
      let count = 0;
      for (let d = 1; d <= today; d++) {
        const dt = new Date(year, month, d);
        const dow = dt.getDay();
        const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        if (dow !== 0 && dow !== 6 && !isHoliday(dateStr)) count++;
      }
      return count;
    }

    // 총모수: 영업대상 전체 / 실질모수: 지도에서 '후순위'로 표시한 지점을 뺀 것
    let dashMode = 'total';
    try { if (localStorage.getItem('bancaDashMode') === 'real') dashMode = 'real'; } catch (e) {}
    let lastDashboard = null;

    // 은행 하나의 통계. 지점 목록이 있으면 거기서 직접 센다(탭에 따라 후순위를 뺄 수 있도록).
    function dashStats(b) {
      if (!b.branches) return { 모수: b.모수, 당월방문: b.당월방문, 미방문: b.미방문, list: null, low: 0 };
      const list = dashMode === 'real' ? b.branches.filter(br => !br.low) : b.branches;
      const visited = list.filter(br => br.visited).length;
      return { 모수: list.length, 당월방문: visited, 미방문: list.length - visited, list,
               low: b.branches.filter(br => br.low).length };
    }

    function renderDashboardSummary(banks) {
      const totals = banks.reduce((a,b) => { const st = dashStats(b);
        a.모수+=st.모수; a.당월방문+=st.당월방문; a.미방문+=st.미방문; a.low+=st.low; return a; },
        {모수:0,당월방문:0,미방문:0,low:0});
      const pct = totals.모수>0 ? Math.round((totals.당월방문/totals.모수)*100) : 0;
      const businessDays = countElapsedBusinessDays();
      const avgPerDay = businessDays>0 ? (totals.당월방문/businessDays).toFixed(1) : '0.0';
      dashboardSummary.innerHTML =
        '<div class="dash-summary-numbers">' +
          '<div class="dash-summary-item total"><div class="num">'+totals.모수+'</div><div class="lbl">'+(dashMode==='real'?'실질 모수':'총 모수')+'</div></div>' +
          '<div class="dash-summary-item visited"><div class="num">'+totals.당월방문+'</div><div class="lbl">방문</div></div>' +
          '<div class="dash-summary-item unvisited"><div class="num">'+totals.미방문+'</div><div class="lbl">미방문</div></div>' +
        '</div>' +
        '<div class="dash-summary-track"><div class="dash-summary-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="dash-summary-extra"><span><b>'+pct+'%</b> 진행</span><span>영업일당 평균 방문수 <b>'+avgPerDay+'</b></span></div>';
      const note = document.getElementById('dashNote');
      if (note) note.textContent = dashMode === 'real'
        ? '실질모수: 영업대상 중 지도에서 후순위로 표시한 ' + totals.low + '곳 제외'
        : '총모수: 판매자정보 시트 K열(영업대상) 체크 기준' + (totals.low ? ' · 후순위 ' + totals.low + '곳 포함' : '');
    }

    function buildDashboardBank(b) {
      const wrap = document.createElement('div'); wrap.className = 'dash-bank';
      const name = document.createElement('div'); name.className = 'dash-bank-name'; name.textContent = b.은행명;
      wrap.appendChild(name);
      const st = dashStats(b);
      const track = document.createElement('div'); track.className = 'dash-bar-track';
      const pct = st.모수>0 ? Math.round((st.당월방문/st.모수)*100) : 0;
      const fill = document.createElement('div'); fill.className = 'dash-bar-fill'; fill.style.width = pct+'%';
      const lbl = document.createElement('div'); lbl.className = 'dash-bar-label'; lbl.textContent = st.당월방문+' / '+st.모수+' ('+pct+'%)';
      track.appendChild(fill); track.appendChild(lbl); wrap.appendChild(track);
      const stats = document.createElement('div'); stats.className = 'dash-stats';
      stats.innerHTML = '<span>'+(dashMode==='real'?'실질모수 ':'모수 ')+st.모수+'</span><span>당월방문 '+st.당월방문+'</span><span>미방문 '+st.미방문+'</span>' +
        (st.low ? '<span>후순위 '+st.low+(dashMode==='real'?' 제외':'')+'</span>' : '');
      wrap.appendChild(stats);
      const detail = document.createElement('div'); detail.className = 'branch-detail'; detail.style.display = 'none';
      wrap.appendChild(detail);
      function renderBranchChips(list) {
        detail.innerHTML = '';
        if (!list || list.length === 0) { detail.textContent = '지점 정보 없음'; return; }
        // 방문=파랑(후순위여도 동일), 미방문=빨강, 후순위인데 미방문=회색(굳이 안 가도 되는 곳)
        const hasLow = list.some(br => br.low && !br.visited);
        const legend = document.createElement('div'); legend.className = 'dash-legend';
        legend.innerHTML = '<span><i style="background:#1d4ed8"></i>방문</span><span><i style="background:#b91c1c"></i>미방문</span>' +
          (hasLow ? '<span><i style="background:#94a3b8"></i>후순위·미방문</span>' : '');
        detail.appendChild(legend);
        list.forEach(br => {
          const chip = document.createElement('span');
          chip.className = 'branch-chip '+(br.visited ? 'visited' : (br.low ? 'lowun' : 'unvisited'));
          chip.textContent = br.지점명;
          detail.appendChild(chip);
        });
      }

      // 지점 상세는 dashboard 응답에 이미 들어 있어서 즉시 펼쳐진다.
      // (예전에는 은행을 누를 때마다 dashboardBank 요청이 한 번씩 더 나갔다)
      let loaded = false;
      name.onclick = () => {
        if (detail.style.display !== 'none') { detail.style.display = 'none'; return; }
        detail.style.display = 'flex';
        if (loaded) return;
        loaded = true;
        if (b.branches) { renderBranchChips(st.list); return; }
        detail.textContent = '불러오는 중...';
        const url = getUrl();
        if (!url) { detail.textContent = 'URL을 먼저 입력하세요.'; return; }
        jsonpRequest(url, { action: 'dashboardBank', bank: b.은행명 }, data => {
          if (data.error) { detail.textContent = '오류: '+data.error; loaded = false; return; }
          renderBranchChips(data.branches);
        });
      };
      return wrap;
    }
