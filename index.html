      const memo = document.getElementById('taskMemoInput').value.trim();
      if (!url) { showStatus(statusEl, '연결 설정에서 URL을 먼저 입력하세요.', true); return; }
      if (!memo) { showStatus(statusEl, '메모를 입력해주세요.', true); return; }

      const payload = { targetType: taskTargetMode, memo };
      if (taskTargetMode === '거래처') {
        const bank = document.getElementById('taskBankSelect').value;
        const branch = document.getElementById('taskBranchSelect').value;
        if (!bank || !branch) { showStatus(statusEl, '은행과 지점을 선택해주세요.', true); return; }
        payload.bank = bank;
        payload.branch = branch;
        const sellerOpt = taskSellerSelect.selectedOptions[0];
        payload.seller = taskSellerSelect.value;
        payload.title = sellerOpt ? sellerOpt.textContent.replace(taskSellerSelect.value, '').trim() : '';
      } else {
        const targetText = taskTargetTextInput.value.trim();
        if (!targetText) { showStatus(statusEl, '대상을 입력해주세요.', true); return; }
        payload.targetText = targetText;
      }

      payload.id = newId(); // 서버 저장 전에도 이 업무를 수정/완료할 수 있게 id를 미리 정한다
      const label = payload.targetType === '직접입력' ? payload.targetText : payload.bank + ' ' + payload.branch;
      commitTaskOp(enqueueWrite('addTask', { data: JSON.stringify(payload) }, '업무 추가 · ' + label,
        { 입력일: localDateLabel(todayLocalISO()), summary: memo }));
      hideStatus(statusEl);
      document.getElementById('taskMemoInput').value = '';
      if (taskTargetMode === '직접입력') taskTargetTextInput.value = '';
    };

    // ── 업무 목록 상태 ──
    // 서버에서 받은 목록 위에 아직 저장 중인 변경을 덧씌워 보여준다. 모든 변경은 여러 번 적용해도
    // 결과가 같게 만들어서, 이미 반영된 변경을 다시 덧씌워도 문제가 없다.
    let tasksState = [];
    const TASK_EDIT_FIELDS = ['대상유형', '은행', '지점', '판매자명', '직책', '대상텍스트', '메모'];
    function taskFromPayload(d) {
      const biz = d.targetType !== '직접입력';
      return {
        id: d.id, 순서: 0, 입력일: '', 대상유형: biz ? '거래처' : '직접입력',
        은행: biz ? String(d.bank || '').trim() : '', 지점: biz ? String(d.branch || '').trim() : '',
        판매자명: biz ? String(d.seller || '').trim() : '', 직책: biz ? String(d.title || '').trim() : '',
        대상텍스트: biz ? '' : String(d.targetText || '').trim(), 메모: String(d.memo || '').trim(),
        알람일시: String(d.alarm || '').trim(), 담당자이메일: ''
      };
    }
    function applyTaskOp(list, op) {
      const p = op.params || {};
      let d = null;
      try { if (p.data) d = JSON.parse(p.data); } catch (e) { return list; }
      if (op.action === 'addTask') {
        if (d && !list.some(t => t.id === d.id)) list.push(Object.assign(taskFromPayload(d), { 입력일: (op.meta && op.meta.입력일) || '' }));
      } else if (op.action === 'editTask') {
        const t = list.find(x => x.id === p.id);
        if (t && d) { const n = taskFromPayload(d); TASK_EDIT_FIELDS.forEach(k => { t[k] = n[k]; }); }
      } else if (op.action === 'setTaskAlarm') {
        const t = list.find(x => x.id === p.id);
        if (t) t.알람일시 = p.alarm || '';
      } else if (op.action === 'completeTask') {
        return list.filter(x => x.id !== p.id);
      } else if (op.action === 'reorderTasks') {
        let ids = []; try { ids = JSON.parse(p.ids || '[]'); } catch (e) {}
        const pos = {}; ids.forEach((id, i) => { pos[id] = i; });
        const listed = list.filter(t => pos[t.id] !== undefined).sort((a, b) => pos[a.id] - pos[b.id]);
        return listed.concat(list.filter(t => pos[t.id] === undefined));
      }
      return list;
    }
    // 방금 넣은 변경을 화면과 기기 보관본에 반영한다
    function commitTaskOp(op) {
      tasksState = applyTaskOp(tasksState.map(t => Object.assign({}, t)), op);
      renderTasks(tasksState);
      const cached = cacheLoad('bootstrap');
      if (cached) { cached.tasks = { ok: true, tasks: tasksState }; cacheSave('bootstrap', cached); }
    }
    function pendingTaskIds() {
      const ids = new Set();
      outbox.forEach(op => {
        if (op.params && op.params.id) ids.add(op.params.id);
        if (op.action === 'addTask') { try { ids.add(JSON.parse(op.params.data).id); } catch (e) {} }
      });
      return ids;
    }

    function taskTargetLine(t) {
      if (t.대상유형 === '직접입력') {
        return `<span class="task-item-target">${escapeHtml(t.대상텍스트)}</span>`;
      }
      let line = `<span class="task-item-target">${escapeHtml(t.은행)} ${escapeHtml(t.지점)}</span>`;
      if (t.판매자명) line += ` · ${escapeHtml(t.판매자명)}${t.직책 ? ' ' + escapeHtml(t.직책) : ''}`;
      return line;
    }

    function isAlarmDue(alarmStr) {
      if (!alarmStr) return false;
      const t = new Date(alarmStr).getTime();
      return !isNaN(t) && t <= Date.now();
    }

    function renderTasks(tasks) {
      const listEl = document.getElementById('taskList');
      const pendingIds = pendingTaskIds();
      listEl.innerHTML = '';
      if (!tasks.length) { listEl.innerHTML = '<div style="font-size:12.5px;color:var(--muted);text-align:center;padding:8px;">등록된 업무가 없습니다.</div>'; return; }
      tasks.forEach((t, idx) => {
        const div = document.createElement('div');
        div.className = 'task-item' + (isAlarmDue(t.알람일시) ? ' alarm-due' : '');
        const alarmLabel = t.알람일시 ? new Date(t.알람일시).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
        div.innerHTML = `
          <div class="task-item-top">
            <div class="task-item-body">
              <div class="task-item-date">${escapeHtml(t.입력일)}${pendingIds.has(t.id) ? '<span class="pending-tag">서버 저장 중</span>' : ''}</div>
              <div>${taskTargetLine(t)}</div>
              <div class="task-item-memo">"${escapeHtml(t.메모)}"</div>
              ${alarmLabel ? `<div style="font-size:11px;color:var(--danger);margin-top:4px;">⏰ ${alarmLabel}</div>` : ''}
            </div>
            <div class="task-item-actions">
              <button class="task-icon-btn task-up-btn" title="위로" ${idx === 0 ? 'disabled' : ''}>▲</button>
              <button class="task-icon-btn task-alarm-btn" title="알람 설정">⏰</button>
              <button class="task-icon-btn task-down-btn" title="아래로" ${idx === tasks.length - 1 ? 'disabled' : ''}>▼</button>
            </div>
          </div>
          <div class="task-item-bottom">
            <button class="task-edit-btn btn-neutral" style="width:auto;padding:7px 14px;font-size:12.5px;">수정</button>
            <button class="task-complete-btn">처리완료</button>
          </div>
        `;
        div.querySelector('.task-up-btn').onclick = () => moveTask(t.id, 'up');
        div.querySelector('.task-down-btn').onclick = () => moveTask(t.id, 'down');
        div.querySelector('.task-alarm-btn').onclick = () => openAlarmModal(t.id, t.알람일시);
        div.querySelector('.task-edit-btn').onclick = () => openTaskEditModal(t);
        div.querySelector('.task-complete-btn').onclick = () => completeTask(t.id);
        listEl.appendChild(div);
      });
    }

    function applyTasks(data) {
      if (!data || data.error || !data.tasks) return;
      let list = data.tasks.map(t => Object.assign({}, t));
      pendingOps().forEach(op => { list = applyTaskOp(list, op); });
      tasksState = list;
      renderTasks(list);
    }

    function loadTasks() {
      const url = getUrl();
      if (!url) return;
      jsonpRequest(url, { action: 'listTasks' }, applyTasks);
    }

    function completeTask(id) {
      if (!confirm('해당 업무를 완료 하시겠습니까?')) return;
      const t = tasksState.find(x => x.id === id);
      const label = t ? (t.대상유형 === '직접입력' ? t.대상텍스트 : t.은행 + ' ' + t.지점) : '';
      const doneAt = new Date();
      const doneLabel = todayLocalISO() + ' ' + String(doneAt.getHours()).padStart(2, '0') + ':' + String(doneAt.getMinutes()).padStart(2, '0');
      commitTaskOp(enqueueWrite('completeTask', { id }, '업무 처리완료 · ' + label,
        { task: t ? Object.assign({}, t, { 처리일시: doneLabel }) : null, summary: t ? t.메모 : '' }));
      if (completedTasksLoaded && t) {
        completedTasksAll.unshift(Object.assign({}, t, { 처리일시: doneLabel }));
        renderCompletedTasksPage();
      }
    }

    function moveTask(id, direction) {
      const idx = tasksState.findIndex(t => t.id === id);
      const j = direction === 'up' ? idx - 1 : idx + 1;
      if (idx < 0 || j < 0 || j >= tasksState.length) return;
      const ids = tasksState.map(t => t.id);
      [ids[idx], ids[j]] = [ids[j], ids[idx]];
      // 아직 출발하지 않은 순서 변경이 대기열 끝에 있으면 새 순서로 바꿔치기한다(여러 번 눌러도 요청은 한 번)
      const last = outbox[outbox.length - 1];
      if (last && last.action === 'reorderTasks' && !(pumpBusy && outbox[0] === last)) {
        last.params.ids = JSON.stringify(ids);
        outboxPersist();
        commitTaskOp(last);
        return;
      }
      commitTaskOp(enqueueWrite('reorderTasks', { ids: JSON.stringify(ids) }, '업무 순서 변경'));
    }

    // ─── 알람 설정 팝업 ───────────────────────────────────────────────────────
    let alarmTargetId = null;
    const alarmModalOverlay = document.getElementById('alarmModalOverlay');
    const alarmDateTimeInput = document.getElementById('alarmDateTimeInput');

    function openAlarmModal(id, currentAlarm) {
      alarmTargetId = id;
      alarmDateTimeInput.value = currentAlarm ? currentAlarm.slice(0, 16) : '';
      alarmModalOverlay.style.display = 'flex';
    }
    function closeAlarmModal() { alarmModalOverlay.style.display = 'none'; alarmTargetId = null; }

    document.getElementById('alarmCancelBtn').onclick = closeAlarmModal;
    document.getElementById('alarmSaveBtn').onclick = () => {
      if (!alarmTargetId) return;
      const url = getUrl();
      const alarm = alarmDateTimeInput.value;
      commitTaskOp(enqueueWrite('setTaskAlarm', { id: alarmTargetId, alarm }, '업무 알람 설정'));
      closeAlarmModal();
    };
    document.getElementById('alarmClearBtn').onclick = () => {
      if (!alarmTargetId) return;
      const url = getUrl();
      commitTaskOp(enqueueWrite('setTaskAlarm', { id: alarmTargetId, alarm: '' }, '업무 알람 해제'));
      closeAlarmModal();
    };

    // ─── 업무 수정 팝업 ───────────────────────────────────────────────────────
    let taskEditMode = '거래처';
    let taskEditTargetId = null;
    const taskEditModalOverlay = document.getElementById('taskEditModalOverlay');
    const taskEditTargetBizBtn = document.getElementById('taskEditTargetBizBtn');
    const taskEditTargetTextBtn = document.getElementById('taskEditTargetTextBtn');
    const taskEditTargetBiz = document.getElementById('taskEditTargetBiz');
    const taskEditSellerSelect = document.getElementById('taskEditSellerSelect');
    const taskEditTargetTextInput = document.getElementById('taskEditTargetTextInput');
    const taskEditBankSelect = document.getElementById('taskEditBankSelect');
    const taskEditBranchSelect = document.getElementById('taskEditBranchSelect');
    const taskEditMemoInput = document.getElementById('taskEditMemoInput');

    function setTaskEditMode(mode) {
      taskEditMode = mode;
      const isBiz = mode === '거래처';
      taskEditTargetBizBtn.classList.toggle('active', isBiz);
      taskEditTargetTextBtn.classList.toggle('active', !isBiz);
      taskEditTargetBiz.style.display = isBiz ? 'flex' : 'none';
      taskEditSellerSelect.style.display = isBiz ? 'block' : 'none';
      taskEditTargetTextInput.style.display = isBiz ? 'none' : 'block';
    }
    taskEditTargetBizBtn.onclick = () => setTaskEditMode('거래처');
    taskEditTargetTextBtn.onclick = () => setTaskEditMode('직접입력');

    function openTaskEditModal(t) {
      taskEditTargetId = t.id;
      setTaskEditMode(t.대상유형 === '직접입력' ? '직접입력' : '거래처');
      taskEditMemoInput.value = t.메모 || '';
      if (t.대상유형 === '직접입력') {
        taskEditTargetTextInput.value = t.대상텍스트 || '';
        taskEditBankSelect.value = '';
        taskEditBranchSelect.innerHTML = '<option value="">지점 선택</option>';
      } else {
        taskEditTargetTextInput.value = '';
        taskEditBankSelect.value = t.은행 || '';
        taskEditBankSelect.dispatchEvent(new Event('change'));
        setTimeout(() => {
          taskEditBranchSelect.value = t.지점 || '';
          taskEditBranchSelect.dispatchEvent(new Event('change'));
          setTimeout(() => { taskEditSellerSelect.value = t.판매자명 || ''; }, 400);
        }, 300);
      }
      taskEditModalOverlay.style.display = 'flex';
    }
    function closeTaskEditModal() { taskEditModalOverlay.style.display = 'none'; taskEditTargetId = null; }
    document.getElementById('taskEditCancelBtn').onclick = closeTaskEditModal;

    document.getElementById('taskEditSaveBtn').onclick = () => {
      if (!taskEditTargetId) return;
      const url = getUrl();
      const memo = taskEditMemoInput.value.trim();
      if (!memo) { alert('메모를 입력해주세요.'); return; }
      const payload = { targetType: taskEditMode, memo };
      if (taskEditMode === '거래처') {
        const bank = taskEditBankSelect.value, branch = taskEditBranchSelect.value;
        if (!bank || !branch) { alert('은행과 지점을 선택해주세요.'); return; }
        payload.bank = bank;
        payload.branch = branch;
        const sellerOpt = taskEditSellerSelect.selectedOptions[0];
        payload.seller = taskEditSellerSelect.value;
        payload.title = sellerOpt ? sellerOpt.textContent.replace(taskEditSellerSelect.value, '').trim() : '';
      } else {
        const targetText = taskEditTargetTextInput.value.trim();
        if (!targetText) { alert('대상을 입력해주세요.'); return; }
        payload.targetText = targetText;
      }
      commitTaskOp(enqueueWrite('editTask', { id: taskEditTargetId, data: JSON.stringify(payload) }, '업무 수정',
        { summary: memo }));
      closeTaskEditModal();
    };

    // ─── 제안서 관리 ─────────────────────────────────────────────────────────
    // 업무 LIST와 같은 방식: 저장은 대기열로 뒤에서 보내고 화면은 즉시 바꾼다.
    let propState = [];
    let propEditId = null;
    let propSort = 'date';
    let propDeletedLoaded = false;
    let propDeletedAll = [];
    const CHANCE_RANK = { '상': 0, '중': 1, '하': 2 };

    function propFromPayload(d) {
      return {
        id: d.id, 입력일: '', 은행: d.bank || '', 지점: d.branch || '', 판매자명: d.seller || '', 직책: d.title || '',
        고객: d.customer || '', 상품: d.product || '', 금액: normalizeAmount(d.amount),
        가능성: d.chance || '', 추진일: d.date || '', 비고: d.note || '', 수정일시: ''
      };
    }
    const PROP_EDIT_FIELDS = ['은행', '지점', '판매자명', '직책', '고객', '상품', '금액', '가능성', '추진일', '비고'];
    function applyPropOp(list, op) {
      const p = op.params || {};
      let d = null;
      try { if (p.data) d = JSON.parse(p.data); } catch (e) { return list; }
      if (op.action === 'addProposalItem') {
        if (d && !list.some(x => x.id === d.id)) list.push(Object.assign(propFromPayload(d), { 입력일: (op.meta && op.meta.입력일) || '' }));
      } else if (op.action === 'editProposalItem') {
        const x = list.find(t => t.id === p.id);
        if (x && d) { const n = propFromPayload(d); PROP_EDIT_FIELDS.forEach(k => { x[k] = n[k]; }); }
      } else if (op.action === 'deleteProposalItem') {
        return list.filter(x => x.id !== p.id);
      }
      return list;
    }
    function applyProposals(data) {
      if (!data || data.error || !data.items) return;
      let list = data.items.map(x => Object.assign({}, x));
      pendingOps().forEach(op => { list = applyPropOp(list, op); });
      propState = list;
      renderProposals();
    }
    function commitPropOp(op) {
      propState = applyPropOp(propState.map(x => Object.assign({}, x)), op);
      renderProposals();
      const cached = cacheLoad('bootstrap');
      if (cached) { cached.proposals = { ok: true, items: propState }; cacheSave('bootstrap', cached); }
    }

    // 금액은 숫자만 쓰면 원 단위 숫자로, 글자가 섞이면('월 50만원', '일시납 1억') 적은 그대로 저장한다
    function isNumericAmount(v) { return /^[\d,\s]+$/.test(String(v || '')) && /\d/.test(String(v || '')); }
    function normalizeAmount(v) {
      const t = String(v || '').trim();
      return isNumericAmount(t) ? t.replace(/[^0-9]/g, '') : t;
    }
    function formatWon(v) {
      if (!isNumericAmount(v)) return String(v || '').trim();
      const n = Number(String(v).replace(/[^0-9]/g, ''));
      return n ? n.toLocaleString('ko-KR') + '원' : '';
    }
    // 1,000만원 / 1억 2,000만원 처럼 읽기 쉬운 표기 (숫자로 적은 금액만)
    function readableWon(digits) {
      if (!isNumericAmount(digits)) return '';
      const n = Number(String(digits || '').replace(/[^0-9]/g, ''));
      if (!n || n < 10000) return '';
      const eok = Math.floor(n / 100000000), man = Math.floor((n % 100000000) / 10000);
      return [eok ? eok.toLocaleString('ko-KR') + '억' : '', man ? man.toLocaleString('ko-KR') + '만' : ''].filter(Boolean).join(' ') + '원';
    }
    function daysUntil(iso) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null;
      const [y, m, d] = iso.split('-').map(Number);
      const t = new Date(); t.setHours(0, 0, 0, 0);
      return Math.round((new Date(y, m - 1, d) - t) / 86400000);
    }
    function ddayLabel(n) { return n === null ? '' : n === 0 ? 'D-day' : n > 0 ? 'D-' + n : 'D+' + (-n); }

    function sortedProposals() {
      const list = propState.slice();
      if (propSort === 'chance') {
        list.sort((a, b) => ((CHANCE_RANK[a.가능성] ?? 9) - (CHANCE_RANK[b.가능성] ?? 9)) || (a.추진일 || '9').localeCompare(b.추진일 || '9'));
      } else if (propSort === 'recent') {
        list.reverse();
      } else {
        // 추진일이 가까운 것부터, 추진일 없는 것은 뒤로
        list.sort((a, b) => (a.추진일 || '9999').localeCompare(b.추진일 || '9999'));
      }
      return list;
    }

    function renderProposals() {
      const listEl = document.getElementById('propList');
      const pendingIds = new Set();
      outbox.forEach(op => {
        if (!/ProposalItem$/.test(op.action)) return;
        if (op.params.id) pendingIds.add(op.params.id);
        try { if (op.params.data) pendingIds.add(JSON.parse(op.params.data).id); } catch (e) {}
      });

      document.getElementById('propBadge').textContent = propState.length ? propState.length + '건' : '';
      // 합계는 숫자로 적은 금액만 더한다(글자로 적은 금액은 단위가 제각각이라 더하면 틀린다)
      const numeric = propState.filter(x => isNumericAmount(x.금액));
      const total = numeric.reduce((a, x) => a + (Number(String(x.금액).replace(/[^0-9]/g, '')) || 0), 0);
      const textCount = propState.filter(x => x.금액 && !isNumericAmount(x.금액)).length;
      const cnt = k => propState.filter(x => x.가능성 === k).length;
      document.getElementById('propStats').innerHTML = propState.length
        ? `<span>진행 <b>${propState.length}</b>건</span><span>합계 <b>${escapeHtml(readableWon(String(total)) || formatWon(String(total)) || '0원')}</b>${textCount ? ` (글자 금액 ${textCount}건 제외)` : ''}</span>` +
          `<span>상 <b>${cnt('상')}</b> · 중 <b>${cnt('중')}</b> · 하 <b>${cnt('하')}</b></span>`
        : '';

      listEl.innerHTML = '';
      if (!propState.length) {
        listEl.innerHTML = '<div style="font-size:12.5px;color:var(--muted);text-align:center;padding:10px;">등록된 제안서가 없습니다.</div>';
        return;
      }
      sortedProposals().forEach(x => {
        const dd = daysUntil(x.추진일);
        const div = document.createElement('div');
        div.className = 'prop-item' + (dd !== null && dd < 0 ? ' overdue' : '');
        const who = [x.은행 + ' ' + x.지점, x.판매자명 ? x.판매자명 + (x.직책 ? ' ' + x.직책 : '') : ''].filter(Boolean).join(' · ');
        const amount = formatWon(x.금액);
        div.innerHTML = `
          <div class="prop-item-head">
            <span class="prop-cust">${escapeHtml(x.고객 || '고객 미입력')}</span>
            ${x.가능성 ? `<span class="prop-chance c-${escapeHtml(x.가능성)}">${escapeHtml(x.가능성)}</span>` : ''}
            ${pendingIds.has(x.id) ? '<span class="pending-tag">서버 저장 중</span>' : ''}
            <span class="prop-dday${dd !== null && dd < 0 ? ' past' : ''}">${escapeHtml(x.추진일 ? x.추진일 + ' ' + ddayLabel(dd) : '')}</span>
          </div>
          <div>${escapeHtml(x.상품 || '상품 미입력')}${amount ? ` · <span class="prop-amount">${escapeHtml(amount)}</span>` : ''}${readableWon(x.금액) ? ` <span class="prop-sub">(${escapeHtml(readableWon(x.금액))})</span>` : ''}</div>
          <div class="prop-sub">${escapeHtml(who)}${x.입력일 ? ' · 입력 ' + escapeHtml(x.입력일) : ''}</div>
          ${x.비고 ? `<div class="prop-note">${escapeHtml(x.비고)}</div>` : ''}
          <div class="task-item-bottom">
            <button class="btn-neutral prop-edit-btn" style="width:auto;padding:7px 14px;font-size:12.5px;">수정</button>
            <button class="prop-del-btn" style="width:auto;padding:7px 14px;font-size:12.5px;background:var(--danger);">삭제</button>
          </div>`;
        div.querySelector('.prop-edit-btn').onclick = () => startEditProposal(x);
        div.querySelector('.prop-del-btn').onclick = () => deleteProposal(x);
        listEl.appendChild(div);
      });
    }

    function propFormPayload() {
      const bank = document.getElementById('propBankSelect').value;
      const branch = document.getElementById('propBranchSelect').value;
      const sel = document.getElementById('propSellerSelect');
      const opt = sel.selectedOptions[0];
      return {
        bank, branch, seller: sel.value,
        title: sel.value && opt ? opt.textContent.replace(sel.value, '').trim() : '',
        customer: document.getElementById('propCustomer').value.trim(),
        product: document.getElementById('propProduct').value.trim(),
        amount: normalizeAmount(document.getElementById('propAmount').value),
        chance: document.getElementById('propChance').value,
        date: document.getElementById('propDate').value,
        note: document.getElementById('propNote').value.trim()
      };
    }
    function resetProposalForm() {
      propEditId = null;
      ['propCustomer', 'propProduct', 'propAmount', 'propDate', 'propNote'].forEach(id => { document.getElementById(id).value = ''; });
      document.querySelectorAll('#propProduct option[data-legacy]').forEach(o => o.remove());
      document.getElementById('propChance').value = '';
      document.getElementById('propAmountHint').textContent = '';
      document.getElementById('propFormTitle').textContent = '새 제안서 입력';
      document.getElementById('propFormTitle').classList.remove('editing');
      document.getElementById('propSaveBtn').textContent = '제안서 추가';
      document.getElementById('propCancelEditBtn').style.display = 'none';
    }

    document.getElementById('propAmount').addEventListener('input', function () {
      const hint = document.getElementById('propAmountHint');
      // 숫자만 적는 중이면 쉼표를 넣어 주고, 글자가 섞이면 적은 그대로 둔다
      if (isNumericAmount(this.value)) {
        const digits = this.value.replace(/[^0-9]/g, '');
        this.value = Number(digits).toLocaleString('ko-KR');
        hint.textContent = readableWon(digits);
      } else {
        hint.textContent = '';
      }
    });

    document.getElementById('propSaveBtn').onclick = () => {
      const statusEl = document.getElementById('propStatus');
      const d = propFormPayload();
      if (!d.bank || !d.branch) { showStatus(statusEl, '은행과 지점을 선택해주세요.', true); return; }
      if (!d.customer && !d.product) { showStatus(statusEl, '고객이나 상품 중 하나는 입력해주세요.', true); return; }
      const label = d.bank + ' ' + d.branch + (d.customer ? ' · ' + d.customer : '');
      const summary = [d.product, formatWon(d.amount), d.chance && '가능성 ' + d.chance, d.date && '추진일 ' + d.date, d.note].filter(Boolean).join(' / ');
      if (propEditId) {
        commitPropOp(enqueueWrite('editProposalItem', { id: propEditId, data: JSON.stringify(d) }, '제안서 수정 · ' + label, { summary }));
        showStatus(statusEl, '✓ 수정 완료');
      } else {
        d.id = newId();
        commitPropOp(enqueueWrite('addProposalItem', { data: JSON.stringify(d) }, '제안서 추가 · ' + label,
          { 입력일: localDateLabel(todayLocalISO()), summary }));
        showStatus(statusEl, '✓ 추가 완료');
      }
      resetProposalForm();
    };
    document.getElementById('propCancelEditBtn').onclick = () => { resetProposalForm(); hideStatus(document.getElementById('propStatus')); };

    function startEditProposal(x) {
      propEditId = x.id;
      propPicker.setBank(x.은행);
      propPicker.setBranch(x.지점, () => {
        const sel = document.getElementById('propSellerSelect');
        if (x.판매자명 && ![...sel.options].some(o => o.value === x.판매자명)) {
          // 판매자 목록에서 빠진 사람(삭제 등)이어도 기존 값을 잃지 않게 임시로 넣어 둔다
          const o = document.createElement('option');
          o.value = x.판매자명; o.textContent = x.판매자명 + (x.직책 ? ' ' + x.직책 : '');
          sel.appendChild(o);
        }
        sel.value = x.판매자명 || '';
      });
      document.getElementById('propCustomer').value = x.고객 || '';
      const prodSel = document.getElementById('propProduct');
      prodSel.querySelectorAll('option[data-legacy]').forEach(o => o.remove());
      if (x.상품 && ![...prodSel.options].some(o => o.value === x.상품)) {
        // 목록에 없는 예전 상품명도 잃지 않게 임시로 넣어 둔다
        const o = document.createElement('option');
        o.value = x.상품; o.textContent = x.상품; o.dataset.legacy = '1';
        prodSel.appendChild(o);
      }
      prodSel.value = x.상품 || '';
      document.getElementById('propAmount').value = isNumericAmount(x.금액)
        ? Number(String(x.금액).replace(/[^0-9]/g, '')).toLocaleString('ko-KR') : (x.금액 || '');
      document.getElementById('propAmountHint').textContent = readableWon(x.금액);
      document.getElementById('propChance').value = x.가능성 || '';
      document.getElementById('propDate').value = x.추진일 || '';
      document.getElementById('propNote').value = x.비고 || '';
      const title = document.getElementById('propFormTitle');
      title.textContent = '✏️ 수정 중: ' + (x.고객 || x.상품 || x.은행 + ' ' + x.지점);
      title.classList.add('editing');
      document.getElementById('propSaveBtn').textContent = '수정 저장';
      document.getElementById('propCancelEditBtn').style.display = '';
      hideStatus(document.getElementById('propStatus'));
      title.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function deleteProposal(x) {
      if (!confirm(`${x.고객 || x.상품 || '이 제안서'} (${x.은행} ${x.지점}) 제안서를 삭제할까요?\n삭제한 내용은 '삭제된 제안서 보기'에서 확인할 수 있습니다.`)) return;
      const now = new Date();
      const delAt = todayLocalISO() + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      const snapshot = Object.assign({}, x, { 삭제일시: delAt });
      commitPropOp(enqueueWrite('deleteProposalItem', { id: x.id }, '제안서 삭제 · ' + x.은행 + ' ' + x.지점 + (x.고객 ? ' · ' + x.고객 : ''),
        { item: snapshot, summary: [x.상품, formatWon(x.금액)].filter(Boolean).join(' / ') }));
      if (propEditId === x.id) resetProposalForm();
      if (propDeletedLoaded) { propDeletedAll.unshift(snapshot); renderDeletedProposals(); }
    }

    function renderDeletedProposals() {
      const el = document.getElementById('propDeletedList');
      if (!propDeletedAll.length) { el.innerHTML = '<div style="font-size:12.5px;color:var(--muted);padding:6px 0;">삭제된 제안서가 없습니다.</div>'; return; }
      el.innerHTML = propDeletedAll.map(x => `<div class="prop-del-item">
          <div><b>${escapeHtml(x.고객 || '고객 미입력')}</b> · ${escapeHtml(x.상품 || '상품 미입력')}${x.금액 ? ' · ' + escapeHtml(formatWon(x.금액)) : ''}${x.가능성 ? ' · 가능성 ' + escapeHtml(x.가능성) : ''}</div>
          <div class="prop-sub">${escapeHtml(x.은행 + ' ' + x.지점)}${x.판매자명 ? ' · ' + escapeHtml(x.판매자명) : ''}${x.추진일 ? ' · 추진일 ' + escapeHtml(x.추진일) : ''} · 삭제 ${escapeHtml(x.삭제일시 || '')}</div>
        </div>`).join('');
    }

    document.getElementById('propDeletedDetails').addEventListener('toggle', function () {
      if (!this.open || propDeletedLoaded) return;
      propDeletedLoaded = true;
      const el = document.getElementById('propDeletedList');
      el.textContent = '불러오는 중...';
      jsonpRequest(getUrl(), { action: 'listDeletedProposalItems' }, data => {
        if (!data || data.error || !data.items) { el.textContent = '불러오지 못했습니다. 다시 펼쳐 주세요.'; propDeletedLoaded = false; return; }
        let list = data.items;
        // 아직 서버에 안 간 삭제도 함께 보여준다
        pendingOps('deleteProposalItem').forEach(op => {
          if (op.meta && op.meta.item && !list.some(x => x.id === op.meta.item.id)) list = [op.meta.item].concat(list);
        });
        propDeletedAll = list;
        renderDeletedProposals();
      });
    });

    document.querySelectorAll('.prop-sort button').forEach(b => {
      b.onclick = () => {
        propSort = b.dataset.sort;
        document.querySelectorAll('.prop-sort button').forEach(x => x.classList.toggle('active', x === b));
        try { localStorage.setItem('bancaPropSort', propSort); } catch (e) {}
        renderProposals();
      };
    });
    try {
      const saved = localStorage.getItem('bancaPropSort');
      const btn = saved && document.querySelector('.prop-sort button[data-sort="' + saved + '"]');
      if (btn) { propSort = saved; document.querySelectorAll('.prop-sort button').forEach(x => x.classList.toggle('active', x === btn)); }
    } catch (e) {}

    // ─── 완료된 업무 목록 (펼칠 때 1회 로드, 페이지네이션) ─────────────────────
    const TASK_DONE_PAGE_SIZE = 8;
    let completedTasksLoaded = false;
    let completedTasksAll = [];
    let completedTasksPage = 1;

    function renderCompletedTasksPage() {
      const container = document.getElementById('completedTaskList');
      const totalPages = Math.max(1, Math.ceil(completedTasksAll.length / TASK_DONE_PAGE_SIZE));
      if (completedTasksPage > totalPages) completedTasksPage = totalPages;
      const start = (completedTasksPage - 1) * TASK_DONE_PAGE_SIZE;
      const pageItems = completedTasksAll.slice(start, start + TASK_DONE_PAGE_SIZE);

      container.innerHTML = '';
      pageItems.forEach(t => {
        const div = document.createElement('div');
        div.className = 'task-done-item';
        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div style="flex:1;">
              <div class="task-item-date">${escapeHtml(t.입력일)} → 완료 ${escapeHtml(t.처리일시)}</div>
              <div>${taskTargetLine(t)}</div>
              <div class="task-item-memo">"${escapeHtml(t.메모)}"</div>
            </div>
            <button class="task-done-delete-btn task-icon-btn" title="삭제" style="color:var(--danger);flex-shrink:0;">✕</button>
          </div>
        `;
        div.querySelector('.task-done-delete-btn').onclick = () => deleteCompletedTask(t.id);
        container.appendChild(div);
      });

      if (totalPages > 1) {
        const pager = document.createElement('div');
        pager.style.cssText = 'display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap;';
        for (let p = 1; p <= totalPages; p++) {
          const btn = document.createElement('button');
          btn.textContent = String(p);
          btn.style.cssText = 'width:auto;padding:6px 11px;font-size:12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;' +
            (p === completedTasksPage ? 'background:var(--primary);color:#fff;border-color:var(--primary);' : 'background:#fff;color:var(--text);');
          btn.onclick = () => { completedTasksPage = p; renderCompletedTasksPage(); };
          pager.appendChild(btn);
        }
        container.appendChild(pager);
      }
    }

    function deleteCompletedTask(id) {
      if (!confirm('이 완료 기록을 삭제하시겠습니까?')) return;
      enqueueWrite('deleteCompletedTask', { id }, '완료 기록 삭제');
      completedTasksAll = completedTasksAll.filter(t => t.id !== id);
      renderCompletedTasksPage();
    }

    document.querySelector('.task-done-details').addEventListener('toggle', function () {
      if (!this.open || completedTasksLoaded) return;
      completedTasksLoaded = true;
      const url = getUrl();
      const container = document.getElementById('completedTaskList');
      container.textContent = '불러오는 중...';
      jsonpRequest(url, { action: 'listCompletedTasks' }, data => {
        if (data.error || !data.tasks) { container.textContent = '오류: ' + (data.error || ''); completedTasksLoaded = false; return; }
        // 서버에 아직 안 간 완료/삭제도 반영해서 보여준다
        let list = data.tasks;
        pendingOps().forEach(op => {
          if (op.action === 'completeTask' && op.meta && op.meta.task && !list.some(t => t.id === op.meta.task.id)) list = [op.meta.task].concat(list);
          if (op.action === 'deleteCompletedTask') list = list.filter(t => t.id !== op.params.id);
        });
        if (!list.length) { container.textContent = '완료된 업무가 없습니다.'; return; }
        completedTasksAll = list;
        completedTasksPage = 1;
        renderCompletedTasksPage();
      });
    });

    function applyDashboard(data) {
      if (!data) return;
      if (data.error) { dashboardList.textContent = '오류: ' + data.error; return; }
      lastDashboard = data;
      dashboardList.innerHTML = '';
      if (!data.banks || data.banks.length === 0) { dashboardList.textContent = '영업대상으로 체크된 지점이 없습니다.'; return; }
      renderDashboardSummary(data.banks);
      data.banks.forEach(b => dashboardList.appendChild(buildDashboardBank(b)));
    }

    function loadDashboard() {
      const url = getUrl();
      if (!url) { dashboardList.textContent = '연결 설정에서 URL을 먼저 입력하세요.'; return; }
      dashboardSummary.innerHTML = '';
      dashboardList.textContent = '불러오는 중...';
      jsonpRequest(url, { action: 'dashboard' }, applyDashboard);
    }

    function setDashMode(mode) {
      dashMode = mode;
      try { localStorage.setItem('bancaDashMode', mode); } catch (e) {}
      document.getElementById('dashTabTotal').classList.toggle('active', mode === 'total');
      document.getElementById('dashTabReal').classList.toggle('active', mode === 'real');
      if (lastDashboard) applyDashboard(lastDashboard);
    }
    document.getElementById('dashTabTotal').onclick = () => setDashMode('total');
    document.getElementById('dashTabReal').onclick = () => setDashMode('real');
    setDashMode(dashMode); // 지난번에 보던 탭 복원

    // 지도에서 방문 입력/후순위 변경을 했을 때 대시보드도 서버 갱신을 기다리지 않고 맞춘다.
    // 화면에 떠 있는 것과 기기 저장본 둘 다 고친다.
    function patchDashboardBranch(key, bankName, branchName, fn) {
      const targets = [];
      if (lastDashboard) targets.push(lastDashboard);
      const cachedBoot = cacheLoad('bootstrap');
      if (cachedBoot && cachedBoot.dashboard) targets.push(cachedBoot.dashboard);
      targets.forEach(d => (d.banks || []).forEach(b => (b.branches || []).forEach(br => {
        const hit = (key && br.k) ? br.k === key : (b.은행명 === bankName && br.지점명 === branchName);
        if (hit) fn(br, b);
      })));
      if (cachedBoot) cacheSave('bootstrap', cachedBoot);
      if (lastDashboard) applyDashboard(lastDashboard);
    }

    const toggleDashboardListBtn = document.getElementById('toggleDashboardListBtn');
    toggleDashboardListBtn.onclick = () => {
      const hidden = dashboardList.style.display === 'none';
      dashboardList.style.display = hidden ? 'block' : 'none';
      toggleDashboardListBtn.textContent = hidden ? '은행별 방문 현황 숨기기' : '은행별 방문 현황 보기';
    };
    document.getElementById('refreshDashboardBtn').onclick = loadDashboard;

    // ─── ⑤ 방문 지도 ────────────────────────────────────────────────────────
    // 카카오 지도 SDK는 「지도 열기」를 누른 뒤에야 불러온다.
    // <head>에 넣으면 이 앱의 "외부 스크립트 0개 / 부팅 요청 1번" 성질이 깨지고,
    // 카카오 장애가 첫 화면을 막게 된다.
    const KAKAO_JS_KEY = '716f72f98726e9965086d554767e3b07'; // 카카오 JavaScript 키 (도메인 화이트리스트로 보호되므로 공개돼도 무방)

    const mapState = {
      sdkLoading: false, sdkReady: false, inited: false,
      data: null, map: null, clusterer: null,
      markers: [],            // { key, marker, v, bank }
      viewFilter: 'all', hideLow: false, bank: '', fullscreen: false, // 'all' | 'unvisited' | 'visited'
      myMarker: null, myCircle: null, labels: []
    };

    // 이름표는 화면에 보이는 지점 전부에 붙인다. 지도 밖의 것까지 만들 이유는 없으므로
    // 보이는 영역으로만 제한한다. 아주 축소했을 땐(레벨 9+) 마커가 뭉쳐지므로 이름표도 뗀다.
    const MAP_LABEL_MAX_LEVEL = 8;
    const MAP_LABEL_MAX_COUNT = 600; // 실제 지점 수(453)보다 크게 잡아 잘리지 않게 한다
    const MAP_CLUSTER_MIN_LEVEL = 9; // 이 레벨부터 마커를 뭉친다(이름표가 붙는 레벨과 겹치지 않게)

    const mapStatusEl = () => document.getElementById('mapStatus');

    function mapFail(msg) {
      showStatus(mapStatusEl(), msg, true);
    }

    // 마커 이미지는 상태별로 3개만 만들어 수백 개 마커가 공유한다.
    // (CustomOverlay를 쓰면 DOM이 수백 개 생기고 클러스터링도 안 된다)
    const MAP_MARKER_IMAGES = {};
    function mapMarkerImage(v, low) {
      // 후순위는 상태 색을 유지하되 작고 흐리게 그려서 눈에 덜 띄게 한다.
      const cacheKey = v + (low ? 'L' : '');
      if (MAP_MARKER_IMAGES[cacheKey]) return MAP_MARKER_IMAGES[cacheKey];
      if (low) {
        const stroke = v === 2 ? '#1d4ed8' : '#b91c1c';
        const dash = v === 1 ? ' stroke-dasharray="2 2"' : '';
        const lowSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" opacity="0.55">' +
          '<circle cx="7.5" cy="7.5" r="5.5" fill="#fde047" stroke="' + stroke + '" stroke-width="2"' + dash + '/></svg>';
        MAP_MARKER_IMAGES[cacheKey] = new kakao.maps.MarkerImage(
          'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(lowSvg),
          new kakao.maps.Size(15, 15), { offset: new kakao.maps.Point(7.5, 7.5) });
        return MAP_MARKER_IMAGES[cacheKey];
      }
      let svg, size;
      // 속은 전부 노란색으로 채워 지도 위에서 눈에 띄게 하고, 테두리 색으로 상태를 구분한다.
      size = 22;
      if (v === 0) {        // 미방문 = 빨간 테두리
        svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#fde047" stroke="#b91c1c" stroke-width="2.5"/></svg>';
      } else if (v === 1) { // 통화/제안서만 = 빨간 점선
        svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#fde047" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="3 2.5"/></svg>';
      } else {              // 방문완료 = 파란 테두리 (지우지 않고 색만 바뀐다)
        svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="#fde047" stroke="#1d4ed8" stroke-width="2.5"/></svg>';
      }
      MAP_MARKER_IMAGES[cacheKey] = new kakao.maps.MarkerImage(
        'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
        new kakao.maps.Size(size, size),
        { offset: new kakao.maps.Point(size / 2, size / 2) }
      );
      return MAP_MARKER_IMAGES[cacheKey];
    }

    // 지점키 → { 은행명, 지점명, sellers }. 서버가 만든 키(k)로 조인한다.
    function mapBranchInfo(key) {
      return branchListData.find(b => b.k === key) || null;
    }

    function loadKakaoSdk(done) {
      if (mapState.sdkReady) { done(true); return; }
      if (mapState.sdkLoading) return;
      mapState.sdkLoading = true;

      const script = document.createElement('script');
      let settled = false;
      // 스크립트 요청 자체가 거절되면(401/403) 키·서비스 활성화·도메인 등록 문제이고,
      // 12초 무응답이면 네트워크 문제다. 원인이 다르니 안내도 달라야 한다.
      const finish = (ok, reason) => {
        if (settled) return;
        settled = true;
        clearTimeout(watchdog);
        mapState.sdkLoading = false;
        done(ok, reason);
      };
      const watchdog = setTimeout(() => finish(false, 'timeout'), 12000);

      script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY +
                   '&autoload=false&libraries=services,clusterer';
      script.onload = () => {
        if (!window.kakao || !kakao.maps) { finish(false, 'rejected'); return; }
        kakao.maps.load(() => { mapState.sdkReady = true; finish(true); });
      };
      script.onerror = () => finish(false, 'rejected');
      document.head.appendChild(script);
    }

    function openMap() {
      const wrap = document.getElementById('mapWrap');
      const btn = document.getElementById('mapOpenBtn');

      if (wrap.style.display !== 'none') {   // 이미 열려 있으면 접기
        wrap.style.display = 'none';
        btn.textContent = '지도 열기';
        return;
      }
      wrap.style.display = 'block';
      btn.textContent = '지도 접기';
      if (mapState.inited) { setTimeout(() => mapState.map && mapState.map.relayout(), 0); return; }

      hideStatus(mapStatusEl());
      showStatus(mapStatusEl(), '지도를 불러오는 중...');

      // 좌표는 거의 바뀌지 않으므로 저장해둔 것으로 먼저 그리고, 방문 상태만 뒤에서 갱신한다.
      const cachedMap = cacheLoad('mapData');
      let sdkOk = null, sdkReason = '', fresh = null, freshDone = false;

      const draw = () => {
        if (sdkOk === null) return;
        if (!sdkOk) {
          mapFail(sdkReason === 'rejected'
            ? '카카오 지도 설정을 확인해주세요. 카카오 개발자 사이트에서 ① 카카오맵 사용 설정 ON ② 웹 도메인 등록이 필요합니다.'
            : '지도를 불러오지 못했습니다. 통신 상태를 확인하고 다시 시도해주세요.');
          return;
        }
        // SDK가 준비되면 저장된 좌표로 즉시 표시 (네트워크를 기다리지 않는다)
        if (!mapState.inited && cachedMap && cachedMap.points) {
          initMap(cachedMap);
          showStatus(mapStatusEl(), '최신 방문 현황으로 갱신 중...');
        }
        if (!freshDone) return;

        if (fresh) {
          cacheSave('mapData', fresh);
          if (!mapState.inited) initMap(fresh);
          else setMapData(fresh);
          hideStatus(mapStatusEl());
        } else if (!mapState.inited) {
          mapFail('지도 데이터를 불러오지 못했습니다. 다시 시도해주세요.');
        } else {
          showStatus(mapStatusEl(), '갱신 실패 — 마지막으로 받은 정보를 표시하고 있습니다.', true);
        }
      };

      // SDK와 데이터를 동시에 부른다 (순차로 하면 두 배 느리다)
      loadKakaoSdk((ok, reason) => { sdkOk = ok; sdkReason = reason || ''; draw(); });
      jsonpRequest(getUrl(), { action: 'mapData' }, d => {
        freshDone = true;
        fresh = (d && !d.error && !d.__net && d.points) ? d : null;
        draw();
      });
    }

    function initMap(data) {
      if (!window.kakao || !kakao.maps) { mapFail('지도를 불러오지 못했습니다.'); return; }
      try {
        mapState.data = data;
        const canvas = document.getElementById('mapCanvas');
        // 첫 중심: 좌표가 있는 지점들의 평균 (없으면 서울시청)
        let cLat = 37.5665, cLng = 126.9780;
        if (data.points.length) {
          cLat = data.points.reduce((s, p) => s + p.lat, 0) / data.points.length;
          cLng = data.points.reduce((s, p) => s + p.lng, 0) / data.points.length;
        }
        const map = new kakao.maps.Map(canvas, {
          center: new kakao.maps.LatLng(cLat, cLng), level: 8
        });
        mapState.map = map;

        // 키가 틀리거나 도메인 미등록이면 예외 없이 흰 박스만 뜬다. 타일 로드로 감지한다.
        let tiles = false;
        kakao.maps.event.addListener(map, 'tilesloaded', () => {
          tiles = true;
          hideStatus(mapStatusEl());
        });
        setTimeout(() => {
          if (!tiles) mapFail('지도 키 설정을 확인해주세요 (카카오 개발자 사이트에 도메인 등록 여부).');
        }, 8000);

        mapState.clusterer = new kakao.maps.MarkerClusterer({
          map, averageCenter: true, minLevel: MAP_CLUSTER_MIN_LEVEL, disableClickZoom: false
        });

        // 확대/이동이 끝날 때마다 이름표를 다시 계산한다 (드래그 중에는 뜨지 않는다)
        kakao.maps.event.addListener(map, 'idle', updateMapLabels);

        mapState.inited = true;
        setMapData(data);
        // 카드가 막 펼쳐진 직후라 컨테이너 크기가 아직 안 잡혔을 수 있다. 그 상태로 만들면
        // 지도 영역 계산이 어긋나 이름표가 하나도 안 붙는다. 레이아웃이 끝난 뒤 한 번 더 맞춘다.
        setTimeout(() => {
          if (!mapState.map) return;
          mapState.map.relayout();
          mapState.map.setCenter(new kakao.maps.LatLng(cLat, cLng));
          updateMapLabels();
        }, 250);
      } catch (e) {
        mapFail('지도 초기화 실패: ' + e.message);
      }
    }

    // 마커를 (다시) 만든다. 캐시로 먼저 그린 뒤 최신 데이터가 도착하면 이 함수로 갈아끼운다.
    function setMapData(data) {
      if (!mapState.map) return;
      mapState.data = data;

      if (mapState.clusterer) mapState.clusterer.clear();
      mapState.markers.forEach(m => m.marker.setMap(null));
      clearMapLabels();

      mapState.markers = data.points.map(p => {
        const info = mapBranchInfo(p.k);
        const parts = String(p.k || '').split('|');
        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(p.lat, p.lng),
          image: mapMarkerImage(p.v, p.p === 1),
          title: info ? info.은행명 + ' ' + info.지점명 : ''
        });
        kakao.maps.event.addListener(marker, 'click', () => showMapInfo(p, mapBranchInfo(p.k)));
        return {
          key: p.k, marker, v: p.v, low: p.p === 1,
          // 지점 목록을 아직 못 받았어도 이름표가 비지 않도록 키에서 뽑아 쓴다
          bank: info ? info.은행명 : (parts[0] || ''),
          branch: info ? info.지점명 : (parts[1] || '')
        };
      });

      // 은행 필터 채우기 (지도에 실제로 찍힌 은행만)
      const banks = [...new Set(mapState.markers.map(m => m.bank).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'ko'));
      const sel = document.getElementById('mapBankSelect');
      const keep = sel.value;
      sel.innerHTML = '<option value="">전체 은행</option>' +
        banks.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
      if (keep && banks.indexOf(keep) !== -1) sel.value = keep;
      else mapState.bank = '';

      applyMapFilter();
      rebasePendingVisits();
    }

    // 지금 필터 조건에서 이 마커를 보여줘야 하는지
    function mapMarkerPasses(m) {
      const bankOk = !mapState.bank || m.bank === mapState.bank;
      let stateOk = true;
      // 통화·제안서만 한 곳(v=1)은 아직 가봐야 하므로 '미방문만'에 포함시킨다.
      if (mapState.viewFilter === 'unvisited') stateOk = m.v < 2;
      else if (mapState.viewFilter === 'visited') stateOk = m.v === 2;
      const lowOk = !mapState.hideLow || !m.low;
      return bankOk && stateOk && lowOk;
    }

    function clearMapLabels() {
      mapState.labels.forEach(o => o.setMap(null));
      mapState.labels = [];
    }

    // 화면에 보이는 마커에만 이름표를 붙인다. 축소 상태에서는 붙이지 않는다(글자가 겹쳐 못 읽음).
    function updateMapLabels() {
      if (!mapState.inited) return;
      clearMapLabels();

      const zoomedEnough = mapState.map.getLevel() <= MAP_LABEL_MAX_LEVEL;
      const hint = document.getElementById('mapZoomHint');
      if (hint) hint.style.display = zoomedEnough ? 'none' : 'block';
      if (!zoomedEnough) return;

      const bounds = mapState.map.getBounds();
      const picked = [];
      for (const m of mapState.markers) {
        if (!mapMarkerPasses(m)) continue;
        if (!bounds.contain(m.marker.getPosition())) continue;
        picked.push(m);
        if (picked.length >= MAP_LABEL_MAX_COUNT) break;
      }

      picked.forEach(m => {
        const el = document.createElement('div');
        el.className = 'map-label' + (m.v === 2 ? ' done' : m.v === 1 ? ' called' : '');
        el.innerHTML = `<span class="bk">${escapeHtml(m.bank)}</span>${escapeHtml(m.branch)}`;
        const ov = new kakao.maps.CustomOverlay({
          position: m.marker.getPosition(), content: el,
          xAnchor: 0, yAnchor: 0.5, zIndex: 1, clickable: false
        });
        ov.setMap(mapState.map);
        mapState.labels.push(ov);
      });
    }

    function applyMapFilter() {
      if (!mapState.inited) return;
      const visible = [];
      mapState.markers.forEach(m => {
        if (mapMarkerPasses(m)) visible.push(m.marker);
        else m.marker.setMap(null);
      });
      mapState.clusterer.clear();
      mapState.clusterer.addMarkers(visible);

      // 숫자는 필터와 무관하게 은행 범위 전체 기준으로 보여준다(무엇을 걸렀는지 알 수 있도록).
      const shown = mapState.markers.filter(m => (!mapState.bank || m.bank === mapState.bank));
      const left = shown.filter(m => m.v === 0).length;
      const called = shown.filter(m => m.v === 1).length;
      const done = shown.filter(m => m.v === 2).length;
      const missing = (mapState.data && mapState.data.missing) ? mapState.data.missing.length : 0;

      const lowCount = shown.filter(m => m.low).length;
      let note = `미방문 ${left}곳`;
      if (called) note += ` · 통화만 ${called}곳`;
      note += ` · 방문 ${done}곳 / 전체 ${shown.length}곳`;
      if (mapState.viewFilter === 'unvisited') note = '[미방문만 보는 중] ' + note;
      else if (mapState.viewFilter === 'visited') note = '[방문만 보는 중] ' + note;
      if (lowCount) note += mapState.hideLow ? `  (후순위 ${lowCount}곳 숨김)` : `  (후순위 ${lowCount}곳 포함)`;
      if (missing) note += `  (위치 미등록 ${missing}곳은 표시되지 않음)`;
      document.getElementById('mapNote').textContent = note;

      updateMapLabels();
    }

    // 지점을 누르면 판매자 상세를 팝업으로 띄운다. 입력해 둔 5개 항목은 양이 많아
    // 지도 데이터에 미리 싣지 않고, 누른 지점 것만 그때 받아온 뒤 세션 동안 재사용한다.
    const FIELD_LABELS = [['가족관계','가족관계'],['자택','자택'],['판매성향','판매성향'],
                          ['방문이력','방문이력'],['기타대화내용','기타']];
    const mapDetailCache = {};

    function closeMapDetail() { document.getElementById('mapDetailOverlay').style.display = 'none'; }

    let mapDetailDiag = '';  // 원인 파악용 임시 표시 (해결되면 제거)
    let mapLogTarget = null; // 팝업이 현재 다루는 지점 (방문 입력 대상)

    function renderMapDetail(sellers) {
      const body = document.getElementById('mapDetailBody');
      if (!sellers || !sellers.length) {
        body.innerHTML = '<div class="md-empty">등록된 판매자가 없습니다.</div>' +
          (mapDetailDiag ? `<div style="font-size:10.5px;color:#94a3b8;margin-top:8px;word-break:break-all;">${escapeHtml(mapDetailDiag)}</div>` : '');
        return;
      }
      body.innerHTML = sellers.map((s, i) => {
        const fields = FIELD_LABELS.map(([key, label]) => {
          const v = (s[key] || '').trim();
          return `<div class="md-field${v ? '' : ' empty'}">` +
                 `<span class="lbl">${label}</span>` +
                 `<span class="val">${v ? escapeHtml(v) : '정보 없음'}</span></div>`;
        }).join('');
        return `<div class="md-seller" data-idx="${i}">` +
               `<div class="md-seller-name">${escapeHtml(s.판매자명)}` +
               (s.직책 ? `<span class="pos">${escapeHtml(s.직책)}</span>` : '') +
               `<span class="mv-actions"><button class="md-edit-btn">수정</button></span></div>` +
               fields + `</div>`;
      }).join('');

      body.querySelectorAll('.md-seller').forEach(card => {
        const s = sellers[Number(card.dataset.idx)];
        card.querySelector('.md-edit-btn').onclick = () => startEditSeller(card, s, sellers);
      });
    }

    // 판매자 정보를 팝업에서 그 자리에 고친다. 저장은 '판매자 정보' 카드와 같은 경로(saveSellerFields)를
    // 쓰므로 어느 쪽에서 고치든 결과가 같다. (연.월) 태그도 같은 규칙으로 붙는다.
    function startEditSeller(card, seller, sellers) {
      if (card.querySelector('.md-edit-area')) return; // 이미 편집 중
      const bank = mapLogTarget && mapLogTarget.bank;
      const branch = mapLogTarget && mapLogTarget.branch;
      if (!bank || !branch) { alert('지점 정보를 불러오는 중입니다. 잠시 후 다시 시도해주세요.'); return; }

      card.querySelectorAll('.md-field').forEach(el => el.style.display = 'none');
      card.querySelector('.md-edit-btn').style.display = 'none';

      const wrap = document.createElement('div');
      wrap.className = 'md-edit-area';
      const areas = {};
      FIELD_LABELS.forEach(([key, label]) => {
        const row = document.createElement('div');
        row.style.marginTop = '6px';
        const lb = document.createElement('div');
        lb.style.cssText = 'font-size:11.5px;font-weight:700;color:var(--primary);margin-bottom:2px;';
        lb.textContent = label;
        const ta = document.createElement('textarea');
        ta.className = 'mv-edit'; ta.rows = 2;
        ta.value = seller[key] || '';
        ta.dataset.initial = seller[key] || '';
        areas[key] = ta;
        row.appendChild(lb); row.appendChild(ta); wrap.appendChild(row);
      });
      const save = document.createElement('button');
      save.className = 'btn-primary'; save.style.marginTop = '8px'; save.textContent = '저장';
      const cancel = document.createElement('button');
      cancel.className = 'btn-neutral'; cancel.style.marginTop = '6px'; cancel.textContent = '취소';
      wrap.appendChild(save); wrap.appendChild(cancel);
      card.appendChild(wrap);

      const restore = () => {
        wrap.remove();
        card.querySelectorAll('.md-field').forEach(el => el.style.display = '');
        card.querySelector('.md-edit-btn').style.display = '';
      };
      cancel.onclick = restore;

      save.onclick = () => {
        const payload = { bank, branch, seller: seller.판매자명, date: todayLocalISO() };
        FIELD_LABELS.forEach(([key]) => { payload[key] = buildTaggedValue(areas[key]); });
        FIELD_LABELS.forEach(([key]) => { seller[key] = payload[key]; });
        const k = mapLogTarget.point.k;
        if (mapDetailCache[k]) {
          mapDetailCache[k].sellers = sellers;
          cacheSave('detail:' + k, mapDetailCache[k]);
        }
        queueSellerSave(bank, branch, seller.판매자명, payload, seller.직책 || '');
        renderMapDetail(sellers);
        refreshOpenSellerForm();
      };
    }

    function showMapInfo(point, info) {
      const overlay = document.getElementById('mapDetailOverlay');
      const head = document.getElementById('mapDetailHead');
      const body = document.getElementById('mapDetailBody');

      const label = point.v === 0 ? '미방문' : point.v === 1 ? '통화·제안서만' : '방문완료';
      const cls = point.v === 2 ? 'visited' : 'unvisited';
      const bank = info ? info.은행명 : '';
      const branch = info ? info.지점명 : '';
      const setHead = (b, n) => {
        const lowOn = point.p === 1;
        head.innerHTML = `<div class="md-title">${escapeHtml(b || '')} ${escapeHtml(n || '')}</div>` +
                         `<span class="branch-chip ${cls}">${label}</span>` +
                         (lowOn ? `<span class="branch-chip low">후순위</span>` : '') +
                         `<button id="mapPriorityBtn" class="md-prio">${lowOn ? '후순위 해제' : '후순위로 표시'}</button>`;
        document.getElementById('mapPriorityBtn').onclick = () => toggleBranchPriority(point, b, n);
      };
      setHead(bank, branch || point.k);
      overlay.style.display = 'flex';

      // 방문 입력 버튼이 쓸 대상. 상세 응답이 오면 서버가 확정한 이름으로 갱신된다.
      mapLogTarget = { point: point, bank: bank, branch: branch, setHead: setHead };
      document.getElementById('mapLogDate').value = todayLocalISO();
      document.getElementById('mapLogType').value = '지점방문';
      document.getElementById('mapLogNote').value = '';
      hideStatus(document.getElementById('mapLogStatus'));
      document.getElementById('mapLogBtn').disabled = false;
      document.getElementById('mapVisitList').innerHTML = '';
      if (bank && branch) loadBranchVisits(bank, branch);

      // 저장해둔 상세가 있으면 즉시 보여주고, 뒤에서 조용히 갱신한다.
      const cached = mapDetailCache[point.k] || cacheLoad('detail:' + point.k);
      if (cached && cached.sellers) {
        mapDetailCache[point.k] = cached;
        renderMapDetail(cached.sellers);
        setHead(cached.은행명, cached.지점명);
      } else {
        body.innerHTML = '<div class="md-empty">불러오는 중...</div>';
      }
      const listCount = (info && info.sellers) ? info.sellers.length : -1;

      // 지점키(k)를 항상 함께 보낸다. 프런트 목록이 비어 있어도(부팅 요청 실패 등)
      // 서버가 키만으로 지점을 찾아 상세를 돌려줄 수 있다.
      jsonpRequest(getUrl(), { action: 'branchDetail', bank, branch, key: point.k }, data => {
        if (!data || data.error || !data.sellers) {
          if (cached && cached.sellers) return; // 저장된 내용을 이미 보여줬으면 그대로 둔다
          mapDetailDiag = `진단 B: ${(data && (data.error || data.message)) || '무응답'} / 목록 ${listCount}명 / k=${point.k}`;
          renderMapDetail((info && info.sellers) ? info.sellers : []);
          return;
        }
        if (data.은행명) {
          setHead(data.은행명, data.지점명);
          if (mapLogTarget && mapLogTarget.point.k === point.k) {
            const wasUnknown = !mapLogTarget.bank || !mapLogTarget.branch;
            mapLogTarget.bank = data.은행명;
            mapLogTarget.branch = data.지점명;
            if (wasUnknown) loadBranchVisits(data.은행명, data.지점명);
          }
        }
        if (!data.sellers.length && !(cached && cached.sellers)) {
          mapDetailDiag = `진단 C: 서버 0명 (목록 ${listCount}명) ${data.은행명 || bank} ${data.지점명 || branch}`;
        }
        pendingOps('saveSellerFields').forEach(op => {
          const key = op.meta && op.meta.key;
          if (!key || key.slice(0, key.lastIndexOf('|')) !== point.k) return;
          let d; try { d = JSON.parse(op.params.data); } catch (e) { return; }
          const s = data.sellers.find(x => x.판매자명 === d.seller);
          if (s) SELLER_FIELD_ORDER.forEach(f => { s[f] = d[f] || ''; });
        });
        mapDetailCache[point.k] = data;
        cacheSave('detail:' + point.k, data);
        // 판매자 수정 중이면 입력 중인 내용을 덮지 않는다
        if (!document.querySelector('#mapDetailBody .md-edit-area')) renderMapDetail(data.sellers);
      });
    }

    // ── 이 지점의 방문 이력 ──────────────────────────────────────────────
    function loadBranchVisits(bank, branch) {
      const el = document.getElementById('mapVisitList');
      if (!bank || !branch) { el.innerHTML = ''; return; }
      el.innerHTML = '<div class="mv-title">방문 이력</div><div class="md-empty">불러오는 중...</div>';
      const want = bank + '|' + branch;
      if (branchVisitsCache[want]) renderBranchVisits(bank, branch, branchVisitsCache[want]);
      jsonpRequest(getUrl(), { action: 'branchVisits', bank, branch }, data => {
        if (!mapLogTarget || mapLogTarget.bank + '|' + mapLogTarget.branch !== want) return; // 다른 지점으로 넘어감
        if (!data || data.error || !data.visits) {
          if (branchVisitsCache[want]) return;
          el.innerHTML = '<div class="mv-title">방문 이력</div><div class="md-empty">이력을 불러오지 못했습니다.</div>';
          return;
        }
        branchVisitsCache[want] = data.visits;
        renderBranchVisits(bank, branch, data.visits);
      });
    }
    const branchVisitsCache = {};

    function renderBranchVisits(bank, branch, visits) {
      const el = document.getElementById('mapVisitList');
      // 아직 서버에 안 간 방문은 맨 위에 '저장 중'으로 보여준다(수정/삭제는 저장된 뒤에)
      const pend = outbox.filter(op => op.action === 'logVisit' && op.meta && op.meta.bank === bank && op.meta.branch === branch)
        .reverse()
        .map(op => `<div class="mv-item pending">
            <div class="mv-head">
              <span class="mv-date">${escapeHtml(localDateLabel(op.meta.date))}</span>
              <span class="mv-type">${escapeHtml(op.meta.visitType)}</span>
              <span class="pending-tag">서버 저장 중</span>
            </div>
            <div class="mv-text${op.meta.note ? '' : ' empty'}">${op.meta.note ? escapeHtml(op.meta.note) : '내용 없음'}</div>
          </div>`).join('');
      const total = visits.length + (pend ? outbox.filter(op => op.action === 'logVisit' && op.meta && op.meta.bank === bank && op.meta.branch === branch).length : 0);
      if (!total) {
        el.innerHTML = '<div class="mv-title">방문 이력</div><div class="md-empty">아직 방문 기록이 없습니다.</div>';
        return;
      }
      el.innerHTML = '<div class="mv-title">방문 이력 ' + total + '건</div>' + pend +
        visits.map(v => {
          const txt = (v.내용 || '').trim();
          return `<div class="mv-item" data-row="${v.row}">
            <div class="mv-head">
              <span class="mv-date">${escapeHtml(v.날짜)}</span>
              <span class="mv-type">${escapeHtml(v.방문유형)}</span>
              <span class="mv-actions">
                <button class="mv-edit-btn">수정</button>
                <button class="mv-del-btn danger">삭제</button>
              </span>
            </div>
            <div class="mv-text${txt ? '' : ' empty'}">${txt ? escapeHtml(txt) : '내용 없음'}</div>
          </div>`;
        }).join('');

      el.querySelectorAll('.mv-item:not(.pending)').forEach(item => {
        const row = Number(item.dataset.row);
        const v = visits.find(x => x.row === row);
        item.querySelector('.mv-edit-btn').onclick = () => startEditVisit(item, bank, branch, v);
        item.querySelector('.mv-del-btn').onclick = () => {
          if (!confirm(`${v.날짜} 방문 기록을 삭제할까요?`)) return;
          jsonpRequest(getUrl(), { action: 'deleteVisit', row, bank, branch }, d => {
            if (!d || d.error || d.ok === false) { alert('오류: ' + ((d && (d.error || d.message)) || '삭제하지 못했습니다')); return; }
            loadBranchVisits(bank, branch);
          });
        };
      });
    }

    // 한 건을 그 자리에서 고친다. 저장이 끝나면 목록을 서버 기준으로 다시 그린다.
    function startEditVisit(item, bank, branch, v) {
      if (item.querySelector('.mv-edit')) return; // 이미 편집 중
      const ta = document.createElement('textarea');
      ta.className = 'mv-edit'; ta.rows = 3; ta.value = v.내용 || '';
      const sel = document.createElement('select');
      sel.className = 'mv-edit';
      ['지점방문', '통화', '제안서', '기타'].forEach(t => {
        const o = document.createElement('option'); o.value = t; o.textContent = t;
        if (t === v.방문유형) o.selected = true;
        sel.appendChild(o);
      });
      const save = document.createElement('button');
      save.className = 'btn-primary'; save.style.marginTop = '6px'; save.textContent = '저장';
      const cancel = document.createElement('button');
      cancel.className = 'btn-neutral'; cancel.style.marginTop = '6px'; cancel.textContent = '취소';

      item.querySelector('.mv-text').style.display = 'none';
      item.appendChild(sel); item.appendChild(ta); item.appendChild(save); item.appendChild(cancel);

      cancel.onclick = () => { [sel, ta, save, cancel].forEach(e => e.remove()); item.querySelector('.mv-text').style.display = ''; };
      save.onclick = () => {
        save.disabled = true; save.textContent = '저장 중...';
        jsonpRequest(getUrl(), { action: 'updateVisit', row: v.row, bank, branch, note: ta.value, visitType: sel.value }, d => {
          if (!d || d.error || d.ok === false) {
            save.disabled = false; save.textContent = '저장';
            alert('오류: ' + ((d && (d.error || d.message)) || '저장하지 못했습니다'));
            return;
          }
          loadBranchVisits(bank, branch);
        });
      };
    }

    // 방문 입력을 지도/대시보드에 즉시 반영한다. 저장은 기기 대기열에 보관되어 반드시 서버로 가고,
    // 서버가 거절하면 '저장 실패'로 알리고 서버 기준으로 화면을 다시 맞춘다.
    // 이번 달 방문 현황에만 영향을 주므로 다른 달 날짜는 건너뛴다.
    function applyVisitLocally(key, visitType, bank, branch, date) {
      if (date && String(date).slice(0, 7) !== todayLocalISO().slice(0, 7)) return;
      const newV = (!visitType || visitType === '지점방문') ? 2 : 1;
      const m = key ? mapState.markers.find(x => x.key === key) : null;
      if (m && newV > m.v) {   // 이미 같거나 더 진행된 상태면 낮추지 않는다
        m.v = newV;
        m.marker.setImage(mapMarkerImage(newV, m.low));
      }
      // 지도 데이터와 저장본도 같이 고쳐, 다시 열었을 때 예전 상태로 되돌아가지 않게 한다
      const md = mapState.data || cacheLoad('mapData');
      if (key && md && md.points) {
        const p = md.points.find(x => x.k === key);
        if (p && newV > p.v) { p.v = newV; cacheSave('mapData', md); }
      }
      if (m && mapState.inited) applyMapFilter();
      // 대시보드: 이번 달 첫 접촉이면 방문으로 옮긴다
      patchDashboardBranch(key, bank || (m && m.bank), branch || (m && m.branch), (br, b) => {
        if (br.visited) return;
        br.visited = true;
        if (b.미방문 > 0) { b.미방문--; b.당월방문++; }
      });
    }

    // 서버에서 새로 받은 지도/대시보드 위에, 아직 저장 중인 방문을 다시 덧씌운다
    function rebasePendingVisits() {
      pendingOps('logVisit').forEach(op => {
        const m = op.meta || {};
        applyVisitLocally(m.key, m.visitType, m.bank, m.branch, m.date);
      });
    }

    document.getElementById('mapLogBtn').onclick = function () {
      if (!mapLogTarget) return;
      const statusEl = document.getElementById('mapLogStatus');
      const bank = mapLogTarget.bank, branch = mapLogTarget.branch;
      if (!bank || !branch) { showStatus(statusEl, '지점 정보를 불러오는 중입니다. 잠시 후 다시 눌러주세요.', true); return; }
      const date = document.getElementById('mapLogDate').value || todayLocalISO();
      const visitType = document.getElementById('mapLogType').value;
      const note = document.getElementById('mapLogNote').value.trim();

      const key = mapLogTarget.point.k;
      const op = queueVisit(bank, branch, date, visitType, note);
      showStatus(statusEl, `✓ ${localDateLabel(date)} ${visitType} 입력 완료`);
      document.getElementById('mapLogNote').value = '';
      renderBranchVisits(bank, branch, branchVisitsCache[bank + '|' + branch] || []);
      const newV = (!visitType || visitType === '지점방문') ? 2 : 1;
      if (date.slice(0, 7) === todayLocalISO().slice(0, 7) && newV > (mapLogTarget.point.v || 0)) {
        mapLogTarget.point.v = newV;
        const head = document.getElementById('mapDetailHead');
        const chip = head.querySelector('.branch-chip');
        if (chip) { chip.textContent = newV === 2 ? '방문완료' : '통화·제안서만'; chip.className = 'branch-chip ' + (newV === 2 ? 'visited' : 'unvisited'); }
      }
      // 서버에 저장되면 이력을 서버 기준(수정/삭제 가능)으로 다시 불러온다
      onOpDone(op.id, (d, err) => {
        if (err) showStatus(statusEl, '서버 저장 실패: ' + err, true);
        if (mapLogTarget && mapLogTarget.point.k === key && document.getElementById('mapDetailOverlay').style.display !== 'none') {
          loadBranchVisits(bank, branch);
        }
      });
    };

    // 후순위 지정/해제. 저장이 끝난 뒤에만 화면을 바꾼다.
    function toggleBranchPriority(point, bank, branch) {
      const btn = document.getElementById('mapPriorityBtn');
      const next = point.p === 1 ? 0 : 1;
      btn.disabled = true; btn.textContent = '저장 중...';
      jsonpRequest(getUrl(), { action: 'setPriority', key: point.k, low: next ? '1' : '0' }, d => {
        btn.disabled = false;
        if (!d || d.error || d.ok === false) {
          btn.textContent = point.p === 1 ? '후순위 해제' : '후순위로 표시';
          alert('오류: ' + ((d && (d.error || d.message)) || '저장하지 못했습니다'));
          return;
        }
        point.p = next;
        const m = mapState.markers.find(x => x.key === point.k);
        if (m) { m.low = next === 1; m.marker.setImage(mapMarkerImage(m.v, m.low)); }
        if (mapState.data && mapState.data.points) {
          const pt = mapState.data.points.find(x => x.k === point.k);
          if (pt) pt.p = next;
          cacheSave('mapData', mapState.data);
        }
        applyMapFilter();
        patchDashboardBranch(point.k, bank, branch, br => { br.low = next === 1; });
        if (mapLogTarget && mapLogTarget.point.k === point.k) mapLogTarget.setHead(bank, branch);
      });
    }

    document.getElementById('mapDetailCloseBtn').onclick = closeMapDetail;
    document.getElementById('mapDetailOverlay').onclick = e => {
      if (e.target.id === 'mapDetailOverlay') closeMapDetail(); // 바깥을 누르면 닫힘
    };

    function mapLocateMe() {
      if (!mapState.inited) return;
      if (!navigator.geolocation) { mapFail('이 브라우저는 위치 기능을 지원하지 않습니다.'); return; }
      showStatus(mapStatusEl(), '현재 위치를 찾는 중...');
      navigator.geolocation.getCurrentPosition(pos => {
        hideStatus(mapStatusEl());
        const here = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        if (mapState.myMarker) mapState.myMarker.setMap(null);
        if (mapState.myCircle) mapState.myCircle.setMap(null);
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"><circle cx="9" cy="9" r="6" fill="#2563eb" stroke="#fff" stroke-width="3"/></svg>';
        mapState.myMarker = new kakao.maps.Marker({
          position: here, zIndex: 10,
          image: new kakao.maps.MarkerImage(
            'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
            new kakao.maps.Size(18, 18), { offset: new kakao.maps.Point(9, 9) })
        });
        mapState.myMarker.setMap(mapState.map);
        mapState.myCircle = new kakao.maps.Circle({
          center: here, radius: Math.min(pos.coords.accuracy || 50, 500),
          strokeWeight: 1, strokeColor: '#2563eb', strokeOpacity: 0.6,
          fillColor: '#2563eb', fillOpacity: 0.12
        });
        mapState.myCircle.setMap(mapState.map);
        mapState.map.setCenter(here);
        mapState.map.setLevel(5);
      }, err => {
        // 거부되면 브라우저 설정에서만 되돌릴 수 있다. 재시도 루프를 돌지 않는다.
        mapFail(err.code === 1
          ? '위치 권한이 거부되었습니다. 브라우저 설정에서 허용해주세요.'
          : '현재 위치를 찾지 못했습니다.');
      }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
    }

    document.getElementById('mapOpenBtn').onclick = openMap;
    document.getElementById('mapBankSelect').onchange = function () {
      mapState.bank = this.value; applyMapFilter();
    };
    const MAP_VIEW_BUTTONS = [
      ['mapViewAllBtn', 'all'], ['mapViewUnvisitedBtn', 'unvisited'], ['mapViewVisitedBtn', 'visited']
    ];
    function setMapView(mode) {
      mapState.viewFilter = mode;
      MAP_VIEW_BUTTONS.forEach(([id, m]) => {
        document.getElementById(id).classList.toggle('active', m === mode);
      });
      applyMapFilter();
    }
    MAP_VIEW_BUTTONS.forEach(([id, m]) => {
      document.getElementById(id).onclick = () => setMapView(m);
    });
    document.getElementById('mapHideLowBtn').onclick = function () {
      mapState.hideLow = !mapState.hideLow;
      this.classList.toggle('active', mapState.hideLow);
      this.textContent = mapState.hideLow ? '후순위 숨기는 중' : '후순위 숨기기';
      applyMapFilter();
    };
    document.getElementById('mapLocateBtn').onclick = mapLocateMe;
    document.getElementById('mapFullBtn').onclick = function () {
      mapState.fullscreen = !mapState.fullscreen;
      document.getElementById('mapWrap').classList.toggle('fullscreen', mapState.fullscreen);
      this.textContent = mapState.fullscreen ? '전체화면 해제' : '전체화면';
      // 컨테이너 크기가 바뀌면 relayout을 불러야 한다 (안 하면 예전 크기로 그려진 채 남는다)
      setTimeout(() => mapState.map && mapState.map.relayout(), 50);
    };

    // ─── 첫 화면: 요청 1번으로 내 정보 + 지점목록 + 업무 + 대시보드를 한꺼번에 ────────
    // 예전에는 getMe / listBranches / listTasks / dashboard 를 각각 따로 불러서
    // 앱을 열 때마다 서버 왕복이 4번 일어났다.
    function boot() {
      const url = getUrl();
      if (!url) { dashboardList.textContent = '연결 설정에서 URL을 먼저 입력하세요.'; return; }
      // 토큰이 없으면 로그인 창은 띄우되, 데이터 로딩은 계속한다
      // (사용자목록 시트가 없는 1인 사용 환경에서는 로그인 창이 스스로 닫힌다)
      if (!getStoredToken()) showUserPicker();

      showCachedUserName();
      outboxReload();
      sellerStore = cacheLoad('sellers');
      sellerStoreFresh = false;

      // 저장된 내용이 있으면 기다리지 않고 즉시 그린다 (체감 0초).
      const cached = cacheLoad('bootstrap');
      if (cached) {
        applyMeResult(cached.me);
        applyBranchList(cached.branches);
        applyTasks(cached.tasks);
        applyProposals(cached.proposals);
        applyDashboard(cached.dashboard);
        rebasePendingVisits();
        setSyncing(true);
      } else {
        dashboardList.textContent = '불러오는 중...';
      }

      pumpOutbox();        // 지난번에 못 보낸 저장이 있으면 이어서 보낸다
      loadSellerDump();    // 판매자 정보 보관본을 뒤에서 최신으로 교체
      fetchBootstrap(!!cached);
    }

    // 서버 기준으로 첫 화면 데이터를 다시 받는다(저장이 거절됐을 때도 사용)
    function refreshFromServer() { fetchBootstrap(true); loadSellerDump(); }
    function fetchBootstrap(hasCached) {
      const url = getUrl();
      const cached = hasCached;
      jsonpRequest(url, { action: 'bootstrap' }, data => {
        setSyncing(false);
        if (data && data.__net) {
          // 통신 실패. 저장된 내용이 있으면 그대로 두고, 없을 때만 안내한다.
          if (!cached) dashboardList.textContent = '연결이 원활하지 않습니다. 새로고침을 눌러 다시 시도하세요.';
          else setSyncing(false, '갱신 실패 — 마지막으로 받은 정보를 표시하고 있습니다');
          return;
        }
        if (!data || data.error) {
          // 구버전 백엔드(bootstrap 미지원 등)에서는 예전 방식으로 되돌려 동작을 보장한다.
          initUser(); loadBranchList(); loadTasks(); loadDashboard();
          return;
        }
        applyMeResult(data.me);
        applyBranchList(data.branches);
        applyTasks(data.tasks);
        applyProposals(data.proposals);
        applyDashboard(data.dashboard);
        // 보관본에는 저장 중인 변경을 덧씌운 상태로 둔다(다음에 열 때 잠깐 옛 상태가 보이지 않게)
        const snap = Object.assign({}, data, { tasks: { ok: true, tasks: tasksState } });
        if (data.proposals && !data.proposals.error) snap.proposals = { ok: true, items: propState };
        cacheSave('bootstrap', snap);
        rebasePendingVisits();
        refreshOpenSellerForm();
      });
    }

    // 화면 위쪽에 조용히 표시되는 갱신 상태 (캐시를 보여주는 동안 최신이 아님을 알린다)
    function setSyncing(on, msg) {
      const el = document.getElementById('syncBadge');
      if (!el) return;
      el.textContent = msg || (on ? '갱신 중...' : '');
      el.style.display = (on || msg) ? 'block' : 'none';
    }

    // ─── 오프라인 지원 ───────────────────────────────────────────────────────
    // 한 번 받아두면 신호가 없어도 앱이 열린다. 화면은 저장된 내용으로 뜨고,
    // 서버가 필요한 동작(입력/수정)만 연결될 때까지 기다린다.
    function showNetBadge(text, color, bg) {
      const el = document.getElementById('netBadge');
      if (!el) return;
      if (!text) { el.style.display = 'none'; return; }
      el.textContent = text;
      el.style.color = color; el.style.background = bg;
      el.style.display = 'block';
    }
    function updateOnlineState() {
      if (navigator.onLine) showNetBadge('', '', '');
      else showNetBadge('오프라인 — 저장해둔 정보를 보고 있습니다', '#92400e', '#fef3c7');
    }
    window.addEventListener('online', updateOnlineState);
    window.addEventListener('offline', updateOnlineState);
    updateOnlineState();

    window.addEventListener('online', pumpOutbox);
    window.addEventListener('offline', renderOutboxBadge);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pumpOutbox(); });
    setInterval(() => { if (outbox.length && !pumpBusy) pumpOutbox(); }, 30000);
    document.getElementById('outboxBadge').onclick = openOutboxModal;
    document.getElementById('outboxModalClose').onclick = () => { document.getElementById('outboxModal').style.display = 'none'; };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              // 이미 쓰고 있던 앱이 있을 때만 = 새 버전이 준비된 상황
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                showNetBadge('새 버전이 준비됐습니다 — 새로고침하세요', '#1d4ed8', '#dbeafe');
              }
            });
          });
        }).catch(() => { /* 지원 안 하는 환경이면 그냥 넘어간다 */ });
      });
    }

    boot();
  </script>
</body>
</html>
